<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:composite="http://java.sun.com/jsf/composite"
              xmlns:p="http://primefaces.org/ui"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:f="http://xmlns.jcp.org/jsf/core"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <composite:interface>
        <composite:attribute required="false" name="cabTitulo" />
        <composite:attribute required="false" name="cabClass" default="textoJustificadoRojo" shortDescription="clase para la cabecera: textoJustificadoRojo ó  textoJustificado"/>
        <composite:attribute required="false" name="msjDetalle" />
        <composite:attribute required="false" name="comType" default="texto" shortDescription="Tipo de item: 'texto', 'check', 'lista', 'link'" />
        <composite:attribute required="false" name="msjUpdate" type="java.lang.String" />
        <composite:attribute required="false" name="msjValue" />
        <composite:attribute required="false" name="msjLink" />
        <composite:attribute required="false" name="msjLinkNombre" />
    </composite:interface>
    <composite:implementation>
        <li class=" #{cc.attrs.cabClass} ">
            <p:outputLabel value="#{cc.attrs.cabTitulo}" rendered="#{not empty cc.attrs.cabTitulo}" />
            <p:outputPanel rendered="#{ cc.attrs.comType eq 'texto'}" class="p-0" >
                <p:outputLabel value="#{cc.attrs.msjDetalle}" class="textoJustificado" />
            </p:outputPanel>

            <p:outputPanel rendered="#{ cc.attrs.comType eq 'check'}" class="textoJustificado p-0" >
                <p:selectBooleanCheckbox  value="#{cc.attrs.msjValue}" 
                                          itemLabel="#{cc.attrs.msjDetalle}"
                                          class="sbcRequisitos " >
                    <p:ajax update="#{cc.attrs.msjUpdate}"  />
                </p:selectBooleanCheckbox>
            </p:outputPanel>

            <p:outputPanel rendered="#{ cc.attrs.comType eq 'lista'}" class="textoJustificado p-0" >
                <ul class="ps-3" style="list-style-type: disc;">
                    <composite:insertChildren/>
                </ul>
            </p:outputPanel>

            <p:outputPanel rendered="#{ cc.attrs.comType eq 'link'}" class="p-0 textoJustificado" >
                <p:outputLabel value="#{cc.attrs.msjDetalle} " style=" display: inline"/><a href="#{cc.attrs.msjLink}" target="_blank" style=" display: inline"> #{cc.attrs.msjLinkNombre} </a>
            </p:outputPanel>

        </li>
    </composite:implementation>
</ui:component>
