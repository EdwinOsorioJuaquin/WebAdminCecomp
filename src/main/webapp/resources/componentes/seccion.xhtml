<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:composite="http://java.sun.com/jsf/composite"
              xmlns:p="http://primefaces.org/ui"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:f="http://xmlns.jcp.org/jsf/core"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <composite:interface>
        <composite:attribute required="true" name="cabLabel" />
        <composite:attribute required="false" name="cabLen" default="col-6" />
        <composite:attribute required="false" name="comType" shortDescription="Tipo de seccion: 1: cabecera, 2: detalle" default="1" />
        <composite:attribute required="false" name="cmdLen" default="col-6" />
    </composite:interface>
    <composite:implementation>
        <div  class="card-cabecera row px-0">
            <div class="#{cc.attrs.cabLen} px-1 divTituloCabecera" >
                <i class="bi bi-grid-fill iconoCabecera" style="display: #{cc.attrs.comType eq '1' ? '' : 'none'}"></i>
                <i class="bi bi-grid-3x3-gap-fill iconoCabecera" style="display: #{cc.attrs.comType eq '2' ? '' : 'none'}"></i>
                <p:outputLabel value="#{cc.attrs.cabLabel}"  />
            </div>  
            <div class="#{cc.attrs.cmdLen} px-0 divcomandosCabecera">
                <div class="d-flex float-end px-0">
                    <composite:insertChildren/>
                </div>
            </div>
        </div>
    </composite:implementation>
</ui:component>
