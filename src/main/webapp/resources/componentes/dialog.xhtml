<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:composite="http://java.sun.com/jsf/composite"
              xmlns:p="http://primefaces.org/ui"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:f="http://xmlns.jcp.org/jsf/core"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <composite:interface>
        <composite:attribute required="false" name="comType" shortDescription="Tipo de seccion: 1: cabecera, 2: detalle" />
        <composite:attribute required="false" name="dlgId" default="comDialog" />
        <composite:attribute required="false" name="dlgWidth" default="600" />
        <composite:attribute required="false" name="dlgHeader" />
        <composite:attribute required="false" name="frmId" default="frm#{cc.attrs.dlgId}" />
        <composite:attribute name="cmdUpdate" required="false" />
    </composite:interface>
    <composite:implementation>
        <p:dialog widgetVar="#{cc.attrs.dlgId}" 
                  showHeader="false" 
                  style="max-width: 90%; max-height: 80%; color: white; padding: 0px;"
                  modal="true" 
                  closable="true" 
                  draggable="false" 
                  resizable="false" 
                  width="#{cc.attrs.dlgWidth}" 
                  height="80%"
                  appendTo="@(body)">
            <h:form id="#{cc.attrs.frmId}" class="p-0" style=" max-height: #{cc.attrs.dlgWidth}px">
                <div style="width: 100%;text-align: center; text-transform: uppercase; font-weight: bold; background: black" class="py-1 text-white ">
                    <p:outputLabel value="#{cc.attrs.dlgHeader}" />
                </div>
                <p:panel style="color: white; background: #4d4d4d;">
                    <composite:insertChildren/>
                </p:panel>
                <div style="width: 100%;text-align: center; background: white" class="py-1">
                    <p:commandButton value="OK" 
                                     class=" bntDireccion"
                                     icon="fa fa-fw fa-check" 
                                     update="#{cc.attrs.cmdUpdate}"
                                     onclick="PF('#{cc.attrs.dlgId}').hide();" />
                </div>
            </h:form>
        </p:dialog> 
    </composite:implementation>
</ui:component>
