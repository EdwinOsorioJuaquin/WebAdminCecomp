<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:composite="http://java.sun.com/jsf/composite"
              xmlns:p="http://primefaces.org/ui"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:f="http://xmlns.jcp.org/jsf/core"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
              xmlns:c="jakarta.tags.core">
    <composite:interface>
        <composite:attribute name="cmdID" required="false" default="comButton" />
        <composite:attribute name="cmdVisible" required="false" default="TRUE" /> 
        <composite:attribute name="cmdDisabled" required="false" />
        <composite:attribute name="cmdValue" required="false" default="" />
        <composite:attribute name="cmdIcon" required="false" default="" />
        <composite:attribute name="cmdUpdate" required="false" default="@form messages" />
        <composite:attribute name="cmdAction" required="false"  method-signature="java.lang.String action()" default="#" />
        <composite:attribute name="setTarget" required="false" />
        <composite:attribute name="setValue" required="false" />
        <composite:attribute name="cmdClass" required="false" default="bntIconsMedio" />
        <composite:attribute name="cmdStyle" required="false"  />
        <composite:attribute name="cmdImmediate" required="false" default="false" />
        <composite:attribute name="cmdType" required="false" shortDescription="tipo de comando: 'simple','texto', 'descarga', 'link', 'exec', 'remote', 'menu', 'mdescarga', 'carga' " default="simple" />
        <composite:attribute name="cmdTooltip" required="false" default="#{cc.attrs.cmdType eq 'mdescarga' ? 'Formato de descarga en formato PDF o XLSX' : ''}" />  
        <composite:attribute name="cmdListener" required="false" method-signature="void action(jakarta.faces.event.ActionEvent)"  />
        <composite:attribute name="cmdOnStart" required="false" default="PF('dlgProcesando').show();" />   
        <composite:attribute name="cmdOnComplete" required="false" default="PF('dlgProcesando').hide();" />   
        <composite:attribute name="conMensaje" required="false"  />
        <composite:attribute name="conIcon" required="false" default="fa fa-warning " />
        <composite:attribute name="attName" required="false"  />
        <composite:attribute name="attValue" required="false"  />
        <composite:attribute name="smValue1" required="false"  />
        <composite:attribute name="smValue2" required="false"  />
        <composite:attribute name="smValue3" required="false"  />
        <composite:attribute name="smValue4" required="false"  />
        <composite:attribute name="smAction1" required="false" method-signature="java.lang.String action()" default="#"/>
        <composite:attribute name="smAction2" required="false" method-signature="java.lang.String action()" default="#"/>
        <composite:attribute name="smAction3" required="false" method-signature="java.lang.String action()" default="#"/>
        <composite:attribute name="smAction4" required="false" method-signature="java.lang.String action()" default="#"/>
        <composite:attribute name="smListenerPdf" required="false" method-signature="void action(jakarta.faces.event.ActionEvent)" />
        <composite:attribute name="smListenerXls" required="false" method-signature="void action(jakarta.faces.event.ActionEvent)" />
        <composite:actionSource name="action" />
        <composite:clientBehavior name="change" event="change" targets="#{cc.attrs.cmdID}"/>
        <composite:clientBehavior name="blur" event="blur" targets="#{cc.attrs.cmdID}"/>
    </composite:interface>
    <composite:implementation>
        <c:if test="#{ cc.attrs.cmdType eq 'simple'}" >
            <c:if test="#{ empty cc.attrs.cmdListener}" >
                <p:commandButton id="#{cc.attrs.cmdID}"
                                 rendered="#{cc.attrs.cmdVisible}"
                                 disabled="#{cc.attrs.cmdDisabled}"
                                 style="#{cc.attrs.cmdStyle}"
                                 class="#{cc.attrs.cmdClass}" 
                                 icon="#{cc.attrs.cmdIcon}"
                                 value="#{cc.attrs.cmdValue}"
                                 onstart="#{cc.attrs.cmdOnStart}" 
                                 oncomplete="#{cc.attrs.cmdOnComplete}"
                                 immediate="#{cc.attrs.cmdImmediate}"
                                 action="#{cc.attrs.cmdAction}"
                                 update="#{cc.attrs.cmdUpdate}">
                    <c:if test="#{not empty cc.attrs.setTarget}">
                        <f:setPropertyActionListener target="#{cc.attrs.setTarget}" value="#{cc.attrs.setValue}"  />
                    </c:if>
                    <c:if test="#{not empty cc.attrs.conMensaje}">
                        <p:confirm header="CONFIRMACIÓN" message="#{cc.attrs.conMensaje}" icon="#{cc.attrs.conIcon} fa-2x" />                   
                    </c:if>
                    <c:if test="#{not empty cc.attrs.attName}">
                        <f:attribute name="#{cc.attrs.attName}" value="#{cc.attrs.attValue}"  />
                    </c:if>
                    <composite:insertChildren/>
                </p:commandButton>   
            </c:if>
            <c:if test="#{ not empty cc.attrs.cmdListener}" >
                <p:commandButton id="#{cc.attrs.cmdID}"
                                 rendered="#{cc.attrs.cmdVisible}"
                                 disabled="#{cc.attrs.cmdDisabled}"
                                 class="#{cc.attrs.cmdClass}" 
                                 style="#{cc.attrs.cmdStyle}"
                                 icon="#{cc.attrs.cmdIcon}"
                                 value="#{cc.attrs.cmdValue}"
                                 onstart="#{cc.attrs.cmdOnStart}" 
                                 oncomplete="#{cc.attrs.cmdOnComplete}"
                                 immediate="#{cc.attrs.cmdImmediate}"
                                 action="#{cc.attrs.cmdAction}"
                                 actionListener="#{cc.attrs.cmdListener}"
                                 update="#{cc.attrs.cmdUpdate}">
                    <c:if test="#{not empty cc.attrs.setTarget}">
                        <f:setPropertyActionListener target="#{cc.attrs.setTarget}" value="#{cc.attrs.setValue}" />
                    </c:if>
                    <c:if test="#{not empty cc.attrs.conMensaje}">
                        <p:confirm header="CONFIRMACIÓN" message="#{cc.attrs.conMensaje}" icon="#{cc.attrs.conIcon} fa-2x" />                   
                    </c:if>
                    <c:if test="#{not empty cc.attrs.attName}">
                        <f:attribute name="#{cc.attrs.attName}" value="#{cc.attrs.attValue}"  />
                    </c:if>
                    <composite:insertChildren/>
                </p:commandButton>                  
            </c:if>
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'descarga'}">
            <p:commandButton id="#{cc.attrs.cmdID}"
                             rendered="#{cc.attrs.cmdVisible}"
                             class="#{cc.attrs.cmdClass}" 
                             style="#{cc.attrs.cmdStyle}"
                             icon="#{cc.attrs.cmdIcon}"
                             value="#{cc.attrs.cmdValue}"
                             onstart="PF('dlgProcesando').show();" 
                             oncomplete="PF('dlgProcesando').hide();"
                             immediate="#{cc.attrs.cmdImmediate}"
                             update="#{cc.attrs.cmdUpdate}"
                             actionListener="#{cc.attrs.cmdListener}">
                <p:fileDownload value="#{generalController.archivo.streamedFile}" />
                <c:if test="#{not empty cc.attrs.attName}">
                    <f:attribute name="#{cc.attrs.attName}" value="#{cc.attrs.attValue}"  />
                </c:if>
                <composite:insertChildren/>
            </p:commandButton>
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'link'}">
            <p:commandLink id="#{cc.attrs.cmdID}"
                           update="#{cc.attrs.cmdUpdate}"
                           class="link-a"
                           styleClass="#{cc.attrs.cmdIcon} cmdlinkIcono"
                           style="#{cc.attrs.cmdStyle}"
                           onstart="#{cc.attrs.cmdOnStart}" 
                           oncomplete="#{cc.attrs.cmdOnComplete}"
                           immediate="#{cc.attrs.cmdImmediate}"
						   disabled="#{cc.attrs.cmdDisabled}"
                           action="#{cc.attrs.cmdAction}">
                <c:if test="#{not empty cc.attrs.setTarget}">
                    <f:setPropertyActionListener target="#{cc.attrs.setTarget}" value="#{cc.attrs.setValue}"  />
                </c:if>
                <c:if test="#{not empty cc.attrs.conMensaje}">
                    <p:confirm  header="CONFIRMACIÓN" message="#{cc.attrs.conMensaje}" icon="#{cc.attrs.conIcon} fa-2x"  />                   
                </c:if>
                <c:if test="#{not empty cc.attrs.attName}">
                    <f:attribute name="#{cc.attrs.attName}" value="#{cc.attrs.attValue}"  />
                </c:if>
                <composite:insertChildren/>
            </p:commandLink>
        </c:if>       
        <c:if test="#{cc.attrs.cmdType eq 'remote'}">
            <p:remoteCommand id="#{cc.attrs.cmdID}" 
                             name="#{cc.attrs.cmdID}" 
                             update="#{cc.attrs.cmdUpdate}" 
                             onstart="#{cc.attrs.cmdOnStart}" 
                             oncomplete="#{cc.attrs.cmdOnComplete}"
                             action="#{cc.attrs.cmdAction}" />
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'exec'}">
            <p:remoteCommand name="#{cc.attrs.cmdType}#{cc.attrs.cmdID}" 
                             update="#{cc.attrs.cmdUpdate}" 
                             onstart="#{cc.attrs.cmdOnStart}" 
                             oncomplete="#{cc.attrs.cmdOnComplete}"
                             action="#{cc.attrs.cmdAction}" />
            <p:commandButton id="#{cc.attrs.cmdID}"
                             rendered="#{cc.attrs.cmdVisible}"
                             class="#{cc.attrs.cmdClass}" 
                             style="#{cc.attrs.cmdStyle}"
                             icon="#{cc.attrs.cmdIcon}"
                             value="#{cc.attrs.cmdValue}"
                             onstart="#{cc.attrs.cmdOnStart}" 
                             oncomplete="#{cc.attrs.cmdOnComplete}"
                             immediate="#{cc.attrs.cmdImmediate}"
                             update="#{cc.attrs.cmdUpdate}"
                             action="#{cc.attrs.cmdAction}">
                <composite:insertChildren/>
            </p:commandButton>
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'menu'}">
            <p:splitButton id="#{cc.attrs.cmdID}"
                           update="#{cc.attrs.cmdUpdate}"
                           onstart="#{cc.attrs.cmdOnStart}" 
                           oncomplete="#{cc.attrs.cmdOnComplete}"
                           class="#{cc.attrs.cmdClass}" 
                           style="#{cc.attrs.cmdStyle}"
                           icon="#{cc.attrs.cmdIcon}"
                           value="#{cc.attrs.cmdValue}"
                           menuStyleClass="contenidoSplitbutton"
                           immediate="#{cc.attrs.cmdImmediate}"
                           action="#{cc.attrs.cmdAction}">
                <p:menuitem rendered="#{not empty cc.attrs.smValue1}"
                            value="#{cc.attrs.smValue1}"
                            action="#{cc.attrs.smAction1}"
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="#{cc.attrs.cmdUpdate}"
                            onstart="#{cc.attrs.cmdOnStart}" 
                            oncomplete="#{cc.attrs.cmdOnComplete}"/>
                <p:menuitem rendered="#{not empty cc.attrs.smValue2}"
                            value="#{cc.attrs.smValue2}"
                            action="#{cc.attrs.smAction2}"
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="#{cc.attrs.cmdUpdate}"
                            onstart="#{cc.attrs.cmdOnStart}" 
                            oncomplete="#{cc.attrs.cmdOnComplete}"/>      
                <p:menuitem rendered="#{not empty cc.attrs.smValue3}"
                            value="#{cc.attrs.smValue3}"
                            action="#{cc.attrs.smAction3}"
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="#{cc.attrs.cmdUpdate}"
                            onstart="#{cc.attrs.cmdOnStart}" 
                            oncomplete="#{cc.attrs.cmdOnComplete}"/>
                <p:menuitem rendered="#{not empty cc.attrs.smValue4}"
                            value="#{cc.attrs.smValue4}"
                            action="#{cc.attrs.smAction4}"
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="#{cc.attrs.cmdUpdate}"
                            onstart="#{cc.attrs.cmdOnStart}" 
                            oncomplete="#{cc.attrs.cmdOnComplete}"/>
            </p:splitButton>
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'mdescarga'}">
            <p:splitButton id="#{cc.attrs.cmdID}"
                           value="Descarga" 
                           class=" #{cc.attrs.cmdClass}" 
                           menuStyleClass="contenidoSplitbutton"
                           actionListener="#{cc.attrs.smListenerPdf}"
                           update="@form messages" 
                           onstart="PF('dlgProcesando').show();" 
                           oncomplete="PF('dlgProcesando').hide();"
                           immediate="#{cc.attrs.cmdImmediate}"
                           icon="pi pi-download">
                <p:fileDownload value="#{generalController.archivo.streamedFile}" />
                <p:menuitem value="PDF" 
                            actionListener="#{cc.attrs.smListenerPdf}"  
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="@form messages" 
                            onstart="PF('dlgProcesando').show();" 
                            oncomplete="PF('dlgProcesando').hide();">
                    <p:fileDownload value="#{generalController.archivo.streamedFile}" />
                </p:menuitem>
                <p:menuitem value="XLS"
                            actionListener="#{cc.attrs.smListenerXls}" 
                            immediate="#{cc.attrs.cmdImmediate}"
                            update="@form messages" 
                            onstart="PF('dlgProcesando').show();" 
                            oncomplete="PF('dlgProcesando').hide();">
                    <p:dataExporter type="xlsx" target="#{cc.attrs.setTarget}" fileName="#{generalController.archivo.nombreFile}"/>
                </p:menuitem>
            </p:splitButton>  
        </c:if>
        <c:if test="#{cc.attrs.cmdType eq 'carga'}">
            <p:fileUpload listener="#{cc.attrs.cmdListener}"
                          id="#{cc.attrs.cmdID}"
                          label="#{cc.attrs.cmdValue}" 
                          auto="true" 
                          mode="simple"
                          skinSimple="true"
                          update="messages "
                          class="h-100"
                          onstart="PF('statusDialog').show();"
                          oncomplete="PF('statusDialog').hide();">
                <composite:insertChildren/>
            </p:fileUpload> 
        </c:if>
        <p:tooltip  for="#{cc.attrs.cmdID}" value="#{cc.attrs.cmdTooltip}" showEffect="clip" hideEffect="clip" hideEvent="mouseleave click" rendered="#{cc.attrs.cmdTooltip ne ''}" />
    </composite:implementation>
</ui:component>
