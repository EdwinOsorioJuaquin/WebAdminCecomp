<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{grupoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar Grupos</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ========================================= -->
                <!-- VISTA LISTA                               -->
                <!-- ========================================= -->
                <h:panelGroup id="pngLista" rendered="#{grupoController.mostrarLista}">

                    <an:seccion cabLabel="Lista de Grupos" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdAction="#{grupoController.doVolver()}"
                                   cmdTooltip="Volver"
                                   rendered="#{not empty grupoController.strBusqueda}"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{grupoController.doBuscar()}"
                                   cmdTooltip="Buscar grupos por curso o docente"/>
                        <an:button cmdValue="Nuevo"
                                   cmdIcon="fa fa-plus"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{grupoController.doNuevo()}"
                                   cmdTooltip="Registrar un nuevo grupo"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por curso o docente"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{grupoController.strBusqueda}"
                              conTooltip="Ingrese nombre del curso o docente para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table cabId="tblGrupos"
                              cabValue="#{grupoController.lstGruposViewDTO}"
                              cabPaginator="true"
                              cabClass="tablaGeneral">

                        <p:column width="180" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info"
                                       cmdValue="Editar"
                                       cmdTooltip="Editar grupo"
                                       cmdUpdate="@form"
                                       cmdAction="#{grupoController.doEditar(registro)}"/>
                            <an:button cmdType="link"
                                       rendered="#{registro.estado}"
                                       cmdIcon="fa fa-ban text-danger"
                                       conMensaje="¿Está seguro de cerrar el grupo?"
                                       cmdTooltip="Cerrar grupo"
                                       cmdUpdate="@form messages"
                                       cmdAction="#{grupoController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       rendered="#{!registro.estado}"
                                       cmdIcon="fa fa-check-circle text-success"
                                       conMensaje="¿Está seguro de abrir el grupo?"
                                       cmdTooltip="Abrir grupo"
                                       cmdUpdate="@form messages"
                                       cmdAction="#{grupoController.doCambiarEstado(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="N°" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="220" headerText="Curso">
                            <an:celda optValue="#{registro.nombreCurso}"/>
                        </p:column>

                        <p:column width="180" headerText="Docente">
                            <an:celda optValue="#{registro.nombreDocente}"/>
                        </p:column>

                        <p:column width="120" headerText="Tipo Desarrollo" styleClass="text-center">
                            <an:celda optValue="#{registro.nombreTipoDesarrollo}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="80" headerText="Grupo" styleClass="text-center">
                            <an:celda optValue="#{registro.nombreGrupo}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="110" headerText="Fecha Inicio" styleClass="text-center">
                            <an:celda optValue="#{registro.fechaFormateada}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="110" headerText="Fecha Fin" styleClass="text-center">
                            <an:celda optValue="#{registro.fechaFinFormateada}" comAlign="text-center"/>
                        </p:column>

                        <!-- ========== NUEVA COLUMNA HORARIO ========== -->
                        <p:column width="150" headerText="Horario">
                            <an:celda optValue="#{registro.horariosFormateados}"/>
                        </p:column>

                        <p:column width="120" headerText="Precio" styleClass="text-center">
                            <an:celda optValue="#{registro.precioFormateado}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="Estado" styleClass="text-center">
                            <an:celda comType="estado" 
                                      optValue="#{registro.estado ? 'ACTIVO' : 'CERRADO'}" 
                                      txtActivo="#{registro.estado ? 'TRUE' : 'FALSE'}" 
                                      comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total grupos: #{grupoController.lstGruposViewDTO != null ? grupoController.lstGruposViewDTO.size() : 0}"/>
                        </f:facet>

                    </an:table>

                </h:panelGroup>

                <!-- ========================================= -->
                <!-- VISTA NUEVO / EDITAR                      -->
                <!-- ========================================= -->
                <h:panelGroup id="pngNuevoGrupo"
                              rendered="#{grupoController.mostrarFormulario}"
                              layout="block">

                    <an:seccion cabLabel="#{grupoController.tituloFormulario}" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{grupoController.doVolver()}"/>

                        <an:button cmdValue="#{grupoController.labelBotonGuardar}"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{grupoController.doGuardar()}"
                                   cmdTooltip="Guardar los datos del grupo"/>
                    </an:seccion>

                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <!-- ================================ -->
                    <!-- DATOS BÁSICOS                    -->
                    <!-- ================================ -->

                    <!-- Curso -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Curso</div>
                        <div class="col-lg-4">
                            <p:selectOneMenu value="#{grupoController.idCursoSeleccionado}" 
                                             style="width:100%"
                                             required="true"
                                             requiredMessage="Seleccione un curso">
                                <f:selectItem itemLabel="-- Seleccione Curso --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstCursos}" 
                                               var="curso"
                                               itemLabel="#{curso.nomCurso}" 
                                               itemValue="#{curso.idCurso}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Docente -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Docente</div>
                        <div class="col-lg-4">
                            <p:selectOneMenu value="#{grupoController.idPersonalSeleccionado}" 
                                             style="width:100%"
                                             required="true"
                                             requiredMessage="Seleccione un docente">
                                <f:selectItem itemLabel="-- Seleccione Docente --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstDocentes}" 
                                               var="docente"
                                               itemLabel="#{docente.escPersonal.drtPersonanatural.nombreCompleto}" 
                                               itemValue="#{docente.idPersonal}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Tipo Desarrollo -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Tipo Desarrollo</div>
                        <div class="col-lg-3">
                            <p:selectOneMenu value="#{grupoController.idTipoDesarrolloSeleccionado}" 
                                             style="width:100%">
                                <f:selectItem itemLabel="-- Seleccione Tipo Desarrollo --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstTiposDesarrollo}" 
                                               var="tipo"
                                               itemLabel="#{tipo.nombreDesarrollo}" 
                                               itemValue="#{tipo.idCiclo}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Grupo Curso -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Grupo</div>
                        <div class="col-lg-2">
                            <p:selectOneMenu value="#{grupoController.idGrupoSeleccionado}" 
                                             style="width:100%">
                                <f:selectItem itemLabel="-- Seleccione Grupo --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstGruposCurso}" 
                                               var="grupoCurso"
                                               itemLabel="#{grupoCurso.nombre}" 
                                               itemValue="#{grupoCurso.idGrupo}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Fechas -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Fecha Inicio</div>
                        <div class="col-lg-3">
                            <p:calendar value="#{grupoController.clsGrupoEdit.fecha}"
                                        pattern="dd/MM/yyyy"
                                        showButtonPanel="true"
                                        navigator="true"
                                        yearRange="c-10:c+10"
                                        style="width:100%"
                                        required="true"
                                        requiredMessage="La fecha de inicio es obligatoria"/>
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Fecha Fin</div>
                        <div class="col-lg-3">
                            <p:calendar value="#{grupoController.clsGrupoEdit.fechaFin}"
                                        pattern="dd/MM/yyyy"
                                        showButtonPanel="true"
                                        navigator="true"
                                        yearRange="c-10:c+10"
                                        style="width:100%"/>
                        </div>
                    </div>

                    <!-- ================================ -->
                    <!-- PRECIO                          -->
                    <!-- ================================ -->

                    <div class="card-cabecera row px-0 mt-3">
                        <div class="col-sm-12 px-1 divTituloCabecera">
                            <i class="bi bi-currency-dollar iconoCabecera"></i>
                            <label class="ui-outputlabel ui-widget">Información de Pago</label>
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Precio (S/.)</div>
                        <div class="col-lg-2">
                            <p:inputText value="#{grupoController.precioMonto}" 
                                         style="width:100%"
                                         required="true"
                                         requiredMessage="El precio es obligatorio">
                                <f:convertNumber pattern="#0.00" />
                            </p:inputText>
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Código Pago</div>
                        <div class="col-lg-3">
                            <p:inputText value="#{grupoController.codigoPago}" 
                                         style="width:100%"
                                         placeholder="Ej: CURSO001"/>
                        </div>
                    </div>

                    <!-- ================================ -->
                    <!-- HORARIOS                        -->
                    <!-- ================================ -->

                    <div class="card-cabecera row px-0 mt-3">
                        <div class="col-sm-12 px-1 divTituloCabecera">
                            <i class="bi bi-clock iconoCabecera"></i>
                            <label class="ui-outputlabel ui-widget">Configuración de Horarios</label>
                        </div>
                    </div>

                    <!-- Días de la semana -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold pt-2">Días</div>
                        <div class="col-lg-8">
                            <p:selectManyCheckbox value="#{grupoController.lstDiasSeleccionados}"
                                                  layout="responsive"
                                                  columns="7">
                                <f:selectItem itemLabel="Lunes" itemValue="1"/>
                                <f:selectItem itemLabel="Martes" itemValue="2"/>
                                <f:selectItem itemLabel="Miércoles" itemValue="3"/>
                                <f:selectItem itemLabel="Jueves" itemValue="4"/>
                                <f:selectItem itemLabel="Viernes" itemValue="5"/>
                                <f:selectItem itemLabel="Sábado" itemValue="6"/>
                                <f:selectItem itemLabel="Domingo" itemValue="7"/>
                            </p:selectManyCheckbox>
                        </div>
                    </div>

                    <!-- Hora -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Hora</div>
                        <div class="col-lg-3">
                            <p:selectOneMenu value="#{grupoController.idHoraSeleccionada}" 
                                             style="width:100%"
                                             required="true"
                                             requiredMessage="Seleccione una hora">
                                <f:selectItem itemLabel="-- Seleccione Hora --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstHoras}" 
                                               var="hora"
                                               itemLabel="#{hora.nomHora}" 
                                               itemValue="#{hora.idHora}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Aula -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Aula</div>
                        <div class="col-lg-3">
                            <p:selectOneMenu value="#{grupoController.idAulaSeleccionada}" 
                                             style="width:100%">
                                <f:selectItem itemLabel="-- Seleccione Aula --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{grupoController.lstAulas}" 
                                               var="aula"
                                               itemLabel="#{aula.nomAula}" 
                                               itemValue="#{aula.idAulClass}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Instrucciones -->
                    <div class="card-cabecera row px-0 mt-3">
                        <div class="col-sm-12 px-1 divTituloCabecera">
                            <i class="bi bi-info-circle iconoCabecera"></i>
                            <label class="ui-outputlabel ui-widget">Instrucciones</label>
                        </div>
                    </div>
                    <ol class="ps-3 mb-0">
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">Complete todos los campos obligatorios (*).</label>
                        </li>
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">Seleccione al menos un día para el horario del grupo.</label>
                        </li>
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">El código de pago se genera automáticamente si no lo especifica.</label>
                        </li>
                    </ol>

                </h:panelGroup>

            </div>
        </h:form>

        <!-- Dialog de Procesando -->
        <p:dialog id="dlgProcesando" widgetVar="dlgProcesando" modal="true" closable="false" 
                  resizable="false" draggable="false" style="width:200px;height:80px;">
            <div style="text-align:center;">
                <i class="fa fa-spinner fa-pulse fa-2x"></i>
                <p:outputLabel value=" Procesando..." style="margin-left:10px;"/>
            </div>
        </p:dialog>

    </ui:define>
</ui:composition>
