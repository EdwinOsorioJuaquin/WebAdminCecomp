<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{registroDecanaturaController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-2">Registro de Decanatura</div>

        <h:form id="frmDecanatura" class="form-horizontal mb-0 h-100">
            <div id="divPrincipal" class="card-contenido shadow-sm rounded-3">

                <!-- =======================
                     LISTA
                ======================== -->
                <h:panelGroup id="pngLista" rendered="#{registroDecanaturaController.strValor eq 'LISTA'}">
                    <an:seccion cabLabel="Registro decanatura" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Nuevo"
                                   cmdAction="#{registroDecanaturaController.doNuevoRango()}"
                                   cmdTooltip="Ingresar rangos"
                                   cmdIcon="fa fa-plus"
                                   cmdUpdate="@form"/>
                        <an:button cmdValue="Buscar"
                                   cmdAction="#{registroDecanaturaController.doBuscar()}"
                                   cmdTooltip="Filtrar por N°"
                                   cmdIcon="fa fa-search-plus"
                                   cmdUpdate="@form"/>
                    </an:seccion>

                    <!-- KPIs -->
                    <an:label cabValue="Total registrados:" comType="texto"
                              conValue="#{registroDecanaturaController.totalRegistrados}  "/>
                    <an:label cabValue="Disponibles:" comType="texto"
                              conValue="#{registroDecanaturaController.totalDisponibles} "/>
                    <an:label cabValue="Último asignado:" comType="texto"
                              conValue="#{registroDecanaturaController.ultimoAsignado} "/>
                    <an:label cabValue="Próximo disponible:" comType="texto"
                              conValue="#{registroDecanaturaController.proximoDisponible} "/>

                    <an:seccion  comType="2" cabLabel="Lista | Registros"></an:seccion>
                    <an:input cabValue="Nro registro"
                            conLen="col-lg-2"
                            conRequired="false"
                            conValue="#{registroDecanaturaController.strBusqueda}"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>
                    <an:table id="dtRegistros"
                            cabId="dtRegistros"
                            cabValue="#{registroDecanaturaController.lstView}"
                            cabPaginator="true">

                      <p:column width="150" headerText="Acciones" styleClass="text-center">
                          <an:button cmdType="link"
                                     cmdIcon="fa fa-edit text-info"
                                     cmdTooltip="Editar número"
                                     cmdAction="#{registroDecanaturaController.doEditar(registro)}"
                                     cmdUpdate="@form"/>

                          <an:button cmdType="link"
                                     rendered="#{registro.activo}"
                                     cmdIcon="fa fa-ban text-danger ms-2"
                                     cmdTooltip="Dar de baja"
                                     conMensaje="¿Está seguro de dar de baja este registro?"
                                     cmdAction="#{registroDecanaturaController.doCambiarEstado(registro)}"
                                     cmdUpdate="@form"/>

                          <an:button cmdType="link"
                                     rendered="#{!registro.activo}"
                                     cmdIcon="fa fa-check-circle text-success ms-2"
                                     cmdTooltip="Activar"
                                     conMensaje="¿Está seguro de activar este registro?"
                                     cmdAction="#{registroDecanaturaController.doCambiarEstado(registro)}"
                                     cmdUpdate="@form"/>
                      </p:column>

                      <p:column width="60" headerText="N°" styleClass="text-center">
                          <an:celda comType="indice" optValue="#{row+1}" comAlign="text-center"/>
                      </p:column>

                      <p:column width="120" headerText="Nro Registro" styleClass="text-center">
                          <an:celda optValue="#{registro.numero}" comAlign="text-center"/>
                      </p:column>

                      <p:column width="160" headerText="Estado" styleClass="text-center">
                          <an:celda optValue="#{registro.estado}"
                                    comType="estado"
                                    txtActivo="#{registro.estado eq 'DISPONIBLE' ? 'TRUE' : 'FALSE'}"
                                    comAlign="text-center"/>
                      </p:column>

                      <p:column width="360" headerText="Asignado a">
                          <an:celda optValue="#{registro.asignadoA}"/>
                      </p:column>

                      <p:column width="140" headerText="Fecha" styleClass="text-center">
                          <an:celda optValue="#{registro.fechaRegistro}" comAlign="text-center"/>
                      </p:column>

                      <f:facet name="footer">
                          <an:celda txtClass="fw-bold bg-transparent"
                                    optValue="Total: #{registroDecanaturaController.lstView != null ? registroDecanaturaController.lstView.size() : 0}"/>
                      </f:facet>
                  </an:table>  
                    
                </h:panelGroup>

                <!-- =======================
                     RANGO
                ======================== -->
                <h:panelGroup id="pngRango" rendered="#{registroDecanaturaController.strValor eq 'RANGO'}">
                    <an:seccion cabLabel="Ingresar rangos" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdAction="#{registroDecanaturaController.doVolverLista()}"
                                   cmdTooltip="Volver a lista"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdImmediate="true"
                                   cmdUpdate="@form"/>
                        <an:button cmdValue="Guardar"
                                   cmdAction="#{registroDecanaturaController.doRegistrarRango()}"
                                   cmdTooltip="Registrar rango"
                                   conMensaje="¿Seguro que desea registrar el rango?"
                                   cmdIcon="fa fa-save"
                                   cmdUpdate="@form"/>
                    </an:seccion>

                    <an:input cabValue="Desde Nro"
                              conValue="#{registroDecanaturaController.numInicio}"
                              conLen="col-lg-2"/>

                    <an:input cabValue="Hasta Nro"
                              conValue="#{registroDecanaturaController.numFin}"
                              conLen="col-lg-2"/>

                    <an:extra comType="separadorSimple" comClass="my-2"/>
                </h:panelGroup>

                <!-- =======================
                     EDITAR (sin dialog)
                ======================== -->
                <h:panelGroup id="pngEditar" rendered="#{registroDecanaturaController.strValor eq 'EDITAR'}">
                    <an:seccion cabLabel="Editar registro" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdAction="#{registroDecanaturaController.doCancelarEdicion()}"
                                   cmdTooltip="Cancelar edición"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdUpdate="@form"/>
                        <an:button cmdValue="Guardar cambios"
                                   cmdAction="#{registroDecanaturaController.doGuardarEdicion()}"
                                   cmdTooltip="Guardar edición"
                                   conMensaje="¿Seguro que desea guardar los cambios?"
                                   cmdIcon="fa fa-save"
                                   cmdUpdate="@form"/>
                    </an:seccion>

                    <an:input cabValue="Nro Registro"
                              conLen="col-lg-2"
                              conValue="#{registroDecanaturaController.edit.numero}"
                              conTooltip="Nuevo número"/>

                    <an:input cabValue="Asignado a"
                              conLen="col-lg-6"
                              conRequired="false"
                              conValue="#{registroDecanaturaController.edit.asignadoA}"
                              conTooltip="Opcional (solo si no está ASIGNADO)"/>

                    <an:extra comType="separadorSimple" comClass="my-2"/>
                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
