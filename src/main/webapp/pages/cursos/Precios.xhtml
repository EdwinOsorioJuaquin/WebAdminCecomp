<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{precioController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar precios</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ========== VISTA LISTA ========== -->
                <h:panelGroup id="pngLista" rendered="#{precioController.strValor eq 'LISTA'}">
                    <an:seccion cabLabel="Lista de Precios" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdAction="#{precioController.doVolver()}"
                                   cmdTooltip="Volver"
                                   rendered="#{not empty precioController.strBusqueda}"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdAction="#{precioController.doBuscar()}"
                                   cmdTooltip="Buscar precios por concepto o tipo"/>
                        <an:button cmdValue="Nuevo"
                                   cmdIcon="fa fa-plus"
                                   cmdAction="#{precioController.doNuevo()}"
                                   cmdTooltip="Registrar un nuevo precio"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por concepto o tipo"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{precioController.strBusqueda}"
                              conTooltip="Ingrese concepto o tipo de precio para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table id="cdtPrecio"
                              cabId="cdtPrecio"
                              cabValue="#{precioController.lstPreciosView}"
                              cabPaginator="true">

                        <p:column width="150" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       rendered="#{registro.activo == 1}"
                                       cmdIcon="fa fa-ban text-danger"
                                       conMensaje="¿Está seguro de cambiar el estado del precio?"
                                       cmdTooltip="Dar de baja el precio"
                                       cmdAction="#{precioController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       rendered="#{registro.activo == 0}"
                                       cmdIcon="fa fa-check-circle text-success"
                                       conMensaje="¿Está seguro de cambiar el estado del precio?"
                                       cmdTooltip="Activar el precio"
                                       cmdAction="#{precioController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info ms-2"
                                       cmdValue="Editar"
                                       cmdTooltip="Editar precio"
                                       cmdAction="#{precioController.doEditar(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="Nro" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="200" headerText="Concepto">
                            <an:celda optValue="#{registro.concepto}"/>
                        </p:column>

                        <p:column width="200" headerText="Tipo Precio">
                            <an:celda optValue="#{registro.tipoPrecio}"/>
                        </p:column>

                        <p:column width="150" headerText="Monto" styleClass="text-center">
                            <an:celda comType="moneda" optValue="#{registro.monto}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="150" headerText="Estado" styleClass="text-center">
                            <an:celda comType="estado" 
                                      optValue="#{registro.activo == 1 ? 'ACTIVO' : 'INACTIVO'}" 
                                      txtActivo="#{registro.activo == 1 ? 'TRUE' : 'FALSE'}" 
                                      comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total precios: #{precioController.lstPreciosView != null ? precioController.lstPreciosView.size() : 0}"/>
                        </f:facet>

                    </an:table>
                </h:panelGroup>

                <!-- ========== VISTA NUEVO / EDITAR ========== -->
                <h:panelGroup id="pngNuevoPrecio"
                              rendered="#{precioController.strValor eq 'NUEVO'}"
                              layout="block">

                    <an:seccion cabLabel="Registro de Precio" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{precioController.doVolver()}"/>
                        <an:button cmdValue="Guardar precio"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{precioController.doGuardar()}"
                                   cmdTooltip="Guardar los datos del precio"/>
                    </an:seccion>

                    <an:input cabValue="Concepto"
                              cabLen="col-lg-2"
                              conLen="col-lg-6"
                              conValue="#{precioController.clsPrecio.concepto}"
                              conTooltip="Ejemplo: CURSO, CERTIFICADO, INSCRIPCION"
                              conRequired="true"/>

                    <an:input cabValue="Tipo Precio"
                              cabLen="col-lg-2"
                              conLen="col-lg-6"
                              conValue="#{precioController.clsPrecio.tipoPrecio}"
                              conTooltip="Ejemplo: GENERAL, ALUMNO_UNS, EXTERNO"
                              conRequired="true"/>

                    <an:input cabValue="Monto"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{precioController.clsPrecio.monto}"
                              conTooltip="Ejemplo: 140.00"
                              conRequired="true"/>

                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
