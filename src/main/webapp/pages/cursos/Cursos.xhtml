<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{cursoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar cursos</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ========== VISTA LISTA ========== -->
                <h:panelGroup id="pngLista" rendered="#{cursoController.strValor eq 'LISTA'}">
                    <an:seccion cabLabel="Lista de Cursos" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdAction="#{cursoController.doVolver()}"
                                   cmdTooltip="Volver"
                                   rendered="#{not empty cursoController.strBusqueda}"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdAction="#{cursoController.doBuscar()}"
                                   cmdTooltip="Buscar cursos por nombre"/>
                        <an:button cmdValue="Nuevo"
                                   cmdIcon="fa fa-plus"
                                   cmdAction="#{cursoController.doNuevo()}"
                                   cmdTooltip="Registrar un nuevo curso"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por nombre"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{cursoController.strBusqueda}"
                              conTooltip="Ingrese nombre del curso para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table id="cdtCurso"
                              cabId="cdtCurso"
                              cabValue="#{cursoController.lstCursosViewDTO}"
                              cabPaginator="true">

                        <p:column width="150" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       rendered="#{registro.curso.bandera}"
                                       cmdIcon="fa fa-ban text-danger"
                                       conMensaje="¿Está seguro de cambiar el estado del curso?"
                                       cmdTooltip="Dar de baja el curso"
                                       cmdAction="#{cursoController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       rendered="#{!registro.curso.bandera}"
                                       cmdIcon="fa fa-check-circle text-success"
                                       conMensaje="¿Está seguro de cambiar el estado del curso?"
                                       cmdTooltip="Activar el curso"
                                       cmdAction="#{cursoController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info ms-2"
                                       cmdValue="Editar"
                                       cmdTooltip="Editar curso"
                                       cmdAction="#{cursoController.doEditar(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="Nro" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="250" headerText="Curso">
                            <an:celda optValue="#{registro.curso.nomCurso}"/>
                        </p:column>

                        <p:column width="120" headerText="Abreviatura" styleClass="text-center">
                            <an:celda optValue="#{registro.curso.abreviatura}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="150" headerText="Nivel" styleClass="text-center">
                            <an:celda optValue="#{registro.nombreNivel}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="150" headerText="Plan Curricular" styleClass="text-center">
                            <an:celda optValue="#{registro.nombrePlan}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="120" headerText="Duración" styleClass="text-center">
                            <an:celda optValue="#{registro.curso.duracion}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="120" headerText="Estado" styleClass="text-center">
                            <an:celda comType="estado" 
                                      optValue="#{registro.curso.bandera ? 'ACTIVO' : 'INACTIVO'}" 
                                      txtActivo="#{registro.curso.bandera ? 'TRUE' : 'FALSE'}" 
                                      comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total cursos: #{cursoController.lstCursosViewDTO != null ? cursoController.lstCursosViewDTO.size() : 0}"/>
                        </f:facet>

                    </an:table>
                </h:panelGroup>

                <!-- ========== VISTA NUEVO / EDITAR ========== -->
                <h:panelGroup id="pngNuevoCurso"
                              rendered="#{cursoController.strValor eq 'NUEVO'}"
                              layout="block">

                    <an:seccion cabLabel="Registro de Curso" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doVolver()}"/>

                        <an:button cmdValue="Guardar curso"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doGuardar()}"
                                   cmdTooltip="Guardar los datos del curso"/>
                    </an:seccion>

                    <an:input cabValue="Nombre del curso"
                              cabLen="col-lg-2"
                              conLen="col-lg-6"
                              conValue="#{cursoController.clsCursoDTO.curso.nomCurso}"
                              conTooltip="Ingrese el nombre del curso"
                              conRequired="true"/>

                    <an:input cabValue="Duración"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.clsCursoDTO.curso.duracion}"
                              conTooltip="Ejemplo: '04 SEMANAS'"
                              conRequired="true"/>

                    <an:input cabValue="Abreviatura"
                              cabLen="col-lg-2"
                              conLen="col-lg-2"
                              conValue="#{cursoController.clsCursoDTO.curso.abreviatura}"
                              conTooltip="Ejemplo: 'EXC', 'JAVA', 'OFI'"
                              conRequired="true"/>

                    <!-- Select para Nivel Modalidad -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Nivel</div>
                        <div class="col-lg-3">
                            <p:selectOneMenu value="#{cursoController.idNivelSeleccionado}" 
                                             style="width:100%">
                                <f:selectItems value="#{cursoController.lstNivelesModalidad}" 
                                               var="nivel"
                                               itemLabel="#{nivel.nomNivMod}" 
                                               itemValue="#{nivel.idNivMod}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Select para Plan Curricular -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Plan Curricular</div>
                        <div class="col-lg-4">
                            <p:selectOneMenu value="#{cursoController.idPlanSeleccionado}" 
                                             style="width:100%">
                                <f:selectItem itemLabel="-- Seleccione Plan Curricular --" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{cursoController.lstPlanesDisponibles}" 
                                               var="plan"
                                               itemLabel="#{plan.nomPland}" 
                                               itemValue="#{plan.idPland}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
