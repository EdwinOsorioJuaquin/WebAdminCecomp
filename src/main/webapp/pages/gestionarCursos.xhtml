<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{cursoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar cursos</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100"  >
            <div id="divPrincipal" class="card-contenido">

                <!-- ========== VISTA LISTA ========== -->
                <h:panelGroup id="pngLista" rendered="#{cursoController.strValor eq 'LISTA'}">
                    <an:seccion cabLabel="Lista de Cursos" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdAction="#{cursoController.doVolver()}"
                                   cmdTooltip="Volver"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdAction="#{cursoController.doBuscar()}"
                                   cmdTooltip="Buscar cursos por nombre"/>
                        <an:button cmdValue="Nuevo"
                                   cmdIcon="fa fa-plus"
                                   cmdAction="#{cursoController.doNuevo()}"
                                   cmdTooltip="Registrar un nuevo curso"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por nombre"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{cursoController.strBusqueda}"
                              conTooltip="Ingrese nombre del curso para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>
                    <an:table id="cdtCurso"
                              cabId="cdtCurso"
                              cabValue="#{cursoController.lstCursosView}"
                              cabPaginator="true">

                        <p:column width="150" headerText="Acciones" styleClass="text-center">
                            <!-- DAR DE BAJA / ACTIVAR -->
                            <an:button cmdType="link"
                                       rendered="#{registro.activo}"
                                       cmdIcon="fa fa-ban text-danger"
                                       conMensaje="¿Está seguro de cambiar el estado del curso?"
                                       cmdTooltip="Dar de baja el curso"
                                       cmdAction="#{cursoController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       rendered="#{!registro.activo}"
                                       cmdIcon="fa fa-check-circle text-success"
                                       conMensaje="¿Está seguro de cambiar el estado del curso?"
                                       cmdTooltip="Activar el curso"
                                       cmdAction="#{cursoController.doCambiarEstado(registro)}"/>
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info ms-2"
                                       cmdValue="Editar"
                                       cmdTooltip="Editar curso"
                                       cmdAction="#{cursoController.doEditar(registro)}"/>
                        </p:column>
                        <p:column width="50" headerText="Nro" styleClass="text-center"><an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/></p:column>
                        <p:column width="350" headerText="Curso"><an:celda optValue="#{registro.nombre}"/></p:column>
                        <p:column width="150" headerText="Nivel" styleClass="text-center"><an:celda optValue="#{registro.nivel}" comAlign="text-center"/></p:column>
                        <p:column width="150" headerText="Duración" styleClass="text-center"><an:celda optValue="#{registro.duracion}" comAlign="text-center"/></p:column>
                        <p:column width="220" headerText="Precio público" styleClass="text-center"><an:celda comType="moneda" optValue="#{registro.precioGeneral}" comAlign="text-center"/></p:column>
                        <p:column width="220" headerText="Precio Alumno UNS" styleClass="text-center"><an:celda comType="moneda" optValue="#{registro.precioAlumnoUns}" comAlign="text-center"/></p:column>
                        <p:column width="150" headerText="Estado" styleClass="text-center"><an:celda comType="estado" optValue="#{registro.estado}" txtActivo="#{registro.estado eq 'ACTIVO' ? 'TRUE' : 'FALSE'}" comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total cursos: #{cursoController.lstCursosView != null ? cursoController.lstCursosView.size() : 0}"/>
                        </f:facet>

                    </an:table>
                </h:panelGroup>

                <!-- ========== VISTA NUEVO / EDITAR ========== -->
                <h:panelGroup id="pngNuevoCurso"
                              rendered="#{cursoController.strValor eq 'NUEVO'}"
                              layout="block">

                    <an:seccion cabLabel="Registro de Curso" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doVolver()}"/>

                        <an:button cmdValue="Siguiente"
                                   cmdIcon="fa fa-arrow-right"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doContinuarTemas()}"
                                   cmdTooltip="Continuar con el registro de temas del curso"/>
                        <an:button cmdValue="Guardar curso"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doGuardar()}"
                                   cmdTooltip="Guardar los datos del curso"/>
                    </an:seccion>

                    <an:input cabValue="Nombre del curso"
                              cabLen="col-lg-2"
                              conLen="col-lg-6"
                              conValue="#{cursoController.nuevoCurso.nombre}"
                              conTooltip="Ingrese el nombre del curso"/>

                    <an:input cabValue="Nivel"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.nivel}"
                              conTooltip="Ingrese el nivel del curso (BÁSICO, INTERMEDIO, AVANZADO)"/>

                    <an:input cabValue="Duración"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.duracion}"
                              conTooltip="Ejemplo: '04 SEMANAS'"/>

                    <an:input cabValue="Precio público general"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.precioGeneral}"
                              conTooltip="Precio para público en general"/>

                    <an:input cabValue="Precio Alumno UNS"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.precioAlumnoUns}"
                              conTooltip="Precio con descuento para alumnos UNS"/>

                    <an:input cabValue="Precio Trabajador UNS"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.precioTrabajadorUns}"
                              conTooltip="Precio para trabajadores UNS o hijos"/>

                    <an:input cabValue="Precio Alumno Externo"
                              cabLen="col-lg-2"
                              conLen="col-lg-3"
                              conValue="#{cursoController.nuevoCurso.precioExterno}"
                              conTooltip="Precio para público externo"/>

                    <an:input cabValue="Curso activo"
                              comType="booleans"
                              cabLen="col-lg-2"
                              conLen="col-lg-2"
                              conValue="#{cursoController.nuevoCurso.activo}"
                              conTooltip="Activar o desactivar la vigencia del curso"/>
                </h:panelGroup>

                <!-- ========== VISTA TEMAS ========== -->
                <h:panelGroup id="pngTemas"
                              rendered="#{cursoController.strValor eq 'TEMAS'}"
                              layout="block">

                    <an:seccion cabLabel="Temas del Curso" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doVolverCursoDesdeTemas()}"
                                   cmdTooltip="Volver al formulario de curso"/>

                        <an:button cmdValue="Guardar todo"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{cursoController.doGuardarTemas()}"
                                   cmdTooltip="Guardar curso y temas"/>
                    </an:seccion>

                    <ui:repeat value="#{cursoController.temas}" var="tema" varStatus="st">
                        <an:input cabValue="Tema #{st.index + 1}"
                                  cabLen="col-lg-2"
                                  conLen="col-lg-6"
                                  conValue="#{cursoController.temas[st.index]}"
                                  conTooltip="Ingrese el nombre del tema #{st.index + 1}"/>
                    </ui:repeat>
                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
