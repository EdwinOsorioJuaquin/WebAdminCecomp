<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                template="/plantilla/plantilla.xhtml">

    <f:metadata>
        <f:viewAction action="#{pagoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Lista de pagos</div>
        <h:form id="frmPrincipal" class="form-horizontal mb-0 h-100">
            <div id="divPrincipal" class="card-contenido">
                <h:panelGroup id="pngBusqueda"  rendered="true">
                    <an:seccion cabLabel="Lista de Pagos" cabLen="col-sm-6" cmdLen="col-sm-6">
                    <an:button cmdValue="Volver"
                               cmdIcon="fa fa-fw fa-arrow-left"
                               cmdClass="bntIconsMedio me-1"
                               cmdTooltip="Volver al menú principal"
                               cmdUpdate="@form"
                               cmdAction="#{pagoController.doVolver()}"/>
                    <an:button cmdValue="Buscar"
                               cmdIcon="fa fa-fw fa-search-plus"
                               cmdClass="bntIconsMedio"
                               cmdTooltip="Buscar pagos"
                               cmdUpdate="@form messages"
                               cmdAction="#{pagoController.doBuscar()}"/>
                    </an:seccion>
                    <an:input cabValue="Búsqueda por Nombre"
                          cabLen="col-lg-2"
                          opClass="d-flex "
                          conValue="#{pagoController.strBusqueda}"
                          conTooltip="Ingrese nombre del estudiante o curso"
                          conRequired="false">
                        <f:facet name="extras">
                            <an:button cmdType="simple"
                                       cmdValue="Filtrar"
                                       cmdIcon="fa fa-search"
                                       cmdClass="bntIconsMedio ms-2"
                                       cmdUpdate="@form messages"
                                       cmdOnStart="PF('dlgProcesando').show();"
                                       cmdOnComplete="PF('dlgProcesando').hide();"
                                       cmdAction="#{pagoController.doBuscar()}"/>
                        </f:facet>
                    </an:input>
                    <an:extra comType="separadorSimple" comClass="my-2"/>
                </h:panelGroup>
                <h:panelGroup id="pngTabla"  rendered="true">
                    <an:seccion cabLabel="Listado de Pagos"
                            cabLen="col-sm-6"
                            cmdLen="col-sm-6">
                    </an:seccion>
                    <an:table cabId="tblPagos"
                          cabValue="#{pagoController.lstPagosView}"
                          cabPaginator="true"
                          cabClass="tablaGeneral">
                        <p:column width="60" headerText="N°" styleClass="text-center">
                            <an:celda comType="indice"
                                      optValue="#{row + 1}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="120" headerText="Fecha" styleClass="text-center">
                            <an:celda optValue="#{registro.fechaTexto}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="120" headerText="Ficha" styleClass="text-center">
                            <an:celda optValue="#{registro.ficha}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="300" headerText="Estudiante">
                            <an:celda optValue="#{registro.estudiante}"/>
                        </p:column>
                        <p:column width="120" headerText="Grupo" styleClass="text-center">
                            <an:celda optValue="#{registro.grupo}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="250" headerText="Curso">
                            <an:celda optValue="#{registro.curso}"/>
                        </p:column>
                        <p:column width="150" headerText="Motivo" styleClass="text-center">
                            <an:celda optValue="#{registro.motivo}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="120" headerText="Monto" styleClass="text-center">
                            <an:celda optValue="#{registro.montoTexto}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="180" headerText="Procedencia" styleClass="text-center">
                            <an:celda optValue="#{registro.procedencia}"
                                      comAlign="text-center"/>
                        </p:column>
                        <p:column width="150" headerText="Operación" styleClass="text-center">
                            <an:celda optValue="#{registro.operacion}"
                                      comAlign="text-center"/>
                        </p:column>
                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total pagos: #{pagoController.lstPagosView != null ? pagoController.lstPagosView.size() : 0} | Total monto: #{pagoController.totalMontoFormateado}"/>
                        </f:facet>

                    </an:table>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
