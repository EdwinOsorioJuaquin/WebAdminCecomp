<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">
    <f:metadata>
        <f:viewAction action="#{nuevoController.doIniciarPagina()}"/>
    </f:metadata>
    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">titulo de ventana</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100"  >
            <div id="divPrincipal" class="card-contenido"> 
                <h:panelGroup id="pngBusqueda"  rendered="true">
                    <an:seccion cabLabel="Contenido">
                        <an:button cmdValue="Buscar"
                                   cmdAction="#{nuevoController.doIniciarPagina()}"
                                   cmdTooltip="Buscar Operacion"
                                   cmdIcon="fa fa-search-plus"/>
                        <an:button cmdValue="Buscar"
                                   cmdAction="#{nuevoController.doIniciarPagina()}"
                                   cmdTooltip="Registrar Operacion"
                                   conMensaje="Seguro que desea aplicar los cambios?"
                                   cmdIcon="fa fa-plus"/>
                        <an:button cmdType="mdescarga"
                                   cmdImmediate="true"
                                   smListenerPdf="#{nuevoController.doDescargar(1)}"
                                   smListenerXls="#{nuevoController.doDescargar(2)}"
                                   setTarget="frmPrincipal:cdtMenu:comTable"/>
                    </an:seccion>
                    <!--para mostrar datos sin ingreso-->
                    <an:label cabValue="Nombre Completo: "
                              conValue="#{generalController.usuario.strNombreCompleto}"/>
                    <!--inputText: ingreso de datos-->
                    <an:input cabValue="Código"
                              conLen="col-lg-2"
                              conValue="#{nuevoController.strValor}"/>
                    <!--inputText con boton de accion al final-->
                    <an:input cabValue="Código Matrícula"
                              conValue="#{nuevoController.strValor}"
                              conLen="col-lg-2"
                              opClass="d-flex "
                              conClass="textoButton"
                              conOnkeypress="if (event.keyCode === 13) {execbtBuscar();return false;} else {return solonum(event);}"
                              conTooltip="Ingrese código y presione ENTER">
                        <f:facet name="extras">
                            <an:button cmdType="exec"
                                       cmdID="btBuscar"
                                       cmdIcon="fa fa-search"
                                       cmdAction="#{nuevoController.doIniciarPagina()}"/>
                        </f:facet>
                    </an:input>
                    <!--selectOneMenu; para seleccionar una opcion-->
                    <an:input cabValue="Tipo"
                              comType="select"
                              conFilter="true"
                              conTooltip="Seleccione una opción"
                              conValue="#{generalController.usuario.strUsuario}">
                        <f:selectItems value="#{generalController.lstMenu}" var="menu" itemValue="#{menu}" itemLabel="#{menu.nombre}"/>
                    </an:input>
                    <!--para ingreso de fechas-->
                    <an:input comType="fecha"
                              cabValue="Fecha"
                              conLen="col-lg-2"
                              conValue=""
                              conTooltip="Ingrese una fecha"/>
                    <!--para ingreso de estados-->
                    <an:input comType="boolean"
                              cabValue="Habilitado"
                              conValue="#{nuevoController.blnLista}"
                              conTooltip="Click para cambiar el estado">
                    </an:input>					
                    <!--otra  opcion de booleano-->
                    <an:input comType="booleans"
                              cabValue="Activo"
                              conValue="#{nuevoController.blnLista}"
                              conTooltip="Click para cambiar el estado">
                    </an:input>
                    <!--carga archivos-->
                    <an:label cabValue="Carga Archivos" opVisible="false" >
                        <an:button cmdType="carga"
                                   class="my-2"
                                   cmdListener="#{nuevoController.doUpload}"
                                   cmdValue="Cargar Archivo"/>
                    </an:label>
                </h:panelGroup>
                <h:panelGroup id="pngLista" rendered="#{!nuevoController.blnLista}">
                    <an:seccion comType="2" cabLabel="Lista | Fecha">
                        <an:button cmdType="descarga"
                                   cmdValue="Descargar"
                                   cmdIcon="pi pi-download"
                                   cmdAction="#{nuevoController.doIniciarPagina()}"/>
                    </an:seccion>
                    <!--muestra de tabla y opciones de tabla-->
                    <an:table id="cdtMenu"
                              cabId="dtMenu"
                              cabValue="#{generalController.lstMenu}"
                              cabPaginator="true">
                        <p:column  width="80" headerText="" class="text-center" >
                            <an:button cmdType="link"
                                       cmdValue="Editar"
                                       cmdIcon="fa fa-edit"
                                       cmdAction="#{nuevoController.doIniciarPagina()}"/>
                            <an:button cmdType="link"
                                       cmdValue="Eliminar"
                                       cmdIcon="fa fa-trash ms-2"
                                       cmdAction="#{nuevoController.doIniciarPagina()}"/>                            
                        </p:column>
                        <p:column  width="50" headerText="Nro" ><an:celda comType="indice" optValue="#{row+1}" comAlign="text-center"/> </p:column>
                        <p:column  width="200" headerText="MENU" sortBy="#{registro.nombre}"><an:celda optValue="#{registro.nombre}" /> </p:column>
                        <p:column  width="800"  headerText="ICONO"><an:celda optValue="#{registro.icono}"/></p:column>
                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"  optValue="Total del mes: "/>
                        </f:facet>
                    </an:table>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
