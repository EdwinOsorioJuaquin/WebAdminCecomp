<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{certificadoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar Certificados</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <p:growl id="growl" showDetail="true" life="3000"/>

                <!-- ========== VISTA LISTA ========== -->
                <h:panelGroup id="pngLista" rendered="#{certificadoController.strValor eq 'LISTA'}">
                    
                    <an:seccion cabLabel="Lista de Certificados" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdAction="#{certificadoController.doVolver()}"
                                   cmdTooltip="Volver"
                                   rendered="#{not empty certificadoController.strBusqueda}"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdAction="#{certificadoController.doBuscar()}"
                                   cmdTooltip="Buscar certificados por alumno o DNI"/>
                        <an:button cmdValue="Nuevo Certificado"
                                   cmdIcon="fa fa-plus"
                                   cmdAction="#{certificadoController.doNuevo()}"
                                   cmdTooltip="Generar nuevo certificado"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por alumno o DNI"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{certificadoController.strBusqueda}"
                              conTooltip="Ingrese nombre del alumno o DNI para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table id="cdtCertificado"
                              cabId="cdtCertificado"
                              cabValue="#{certificadoController.lstCertificadosViewDTO}"
                              cabPaginator="true">

                        <p:column width="120" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-download text-primary"
                                       cmdValue="Descargar"
                                       cmdTooltip="Descargar certificado PDF"
                                       cmdAction="#{certificadoController.doDescargarCertificado(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="Nro" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="DNI" styleClass="text-center">
                            <an:celda optValue="#{registro.dni}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="250" headerText="Alumno">
                            <an:celda optValue="#{registro.nombreCompleto}"/>
                        </p:column>

                        <p:column width="200" headerText="Curso">
                            <an:celda optValue="#{registro.nombreCurso}"/>
                        </p:column>

                        <p:column width="100" headerText="Nota" styleClass="text-center">
                            <an:celda optValue="#{registro.notaFinal}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="120" headerText="Fecha Cert." styleClass="text-center">
                            <an:celda optValue="#{registro.fechaCert}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="Resolución" styleClass="text-center">
                            <an:celda optValue="#{registro.resol}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="Estado" styleClass="text-center">
                            <an:celda comType="estado" 
                                      optValue="#{registro.estadoCert ? 'ACTIVO' : 'ANULADO'}" 
                                      txtActivo="#{registro.estadoCert ? 'TRUE' : 'FALSE'}" 
                                      comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total certificados: #{certificadoController.lstCertificadosViewDTO != null ? certificadoController.lstCertificadosViewDTO.size() : 0}"/>
                        </f:facet>

                    </an:table>

                </h:panelGroup>

                <!-- ========== VISTA NUEVO CERTIFICADO ========== -->
                <h:panelGroup id="pngNuevoCertificado"
                              rendered="#{certificadoController.strValor eq 'NUEVO'}">

                    <an:seccion cabLabel="Generar Certificado" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{certificadoController.doVolver()}"/>

                        <an:button cmdValue="Generar"
                                   cmdIcon="fa fa-file-pdf"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{certificadoController.doGenerarCertificado()}"
                                   cmdTooltip="Generar certificado"/>
                    </an:seccion>

                    <!-- Título de la tabla -->
                    <div class="row mb-2">
                        <div class="col-lg-12">
                            <p:outputLabel value="Matrículas aptas para certificar (Nota ≥ 14)" 
                                           style="font-weight:bold; font-size:14px;"/>
                        </div>
                    </div>

                    <!-- Tabla de matrículas disponibles -->
                    <an:table id="cdtMatriculasDisponibles"
                              cabId="cdtMatriculasDisponibles"
                              cabValue="#{certificadoController.lstMatriculasDisponibles}"
                              cabPaginator="true">

                        <p:column width="80" headerText="Seleccionar" styleClass="text-center">
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-check-circle text-success"
                                       cmdValue="Seleccionar"
                                       cmdTooltip="Seleccionar esta matrícula"
                                       cmdAction="#{certificadoController.doSeleccionarMatricula(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="Nro" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="DNI" styleClass="text-center">
                            <an:celda optValue="#{registro.dni}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="250" headerText="Alumno">
                            <an:celda optValue="#{registro.nombreCompleto}"/>
                        </p:column>

                        <p:column width="200" headerText="Curso">
                            <an:celda optValue="#{registro.nombreCurso}"/>
                        </p:column>

                        <p:column width="100" headerText="Nota" styleClass="text-center">
                            <an:celda optValue="#{registro.notaFinal}" comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total matrículas: #{certificadoController.lstMatriculasDisponibles != null ? certificadoController.lstMatriculasDisponibles.size() : 0}"/>
                        </f:facet>

                    </an:table>

                    <!-- Matrícula seleccionada -->
                    <div class="row mb-2" rendered="#{certificadoController.idMatriculaSeleccionada != null}">
                        <div class="col-lg-2 text-end fw-bold">Matrícula Seleccionada</div>
                        <div class="col-lg-6">
                            <p:outputLabel value="#{certificadoController.idMatriculaSeleccionada}" 
                                           style="font-weight:bold;color:green"/>
                        </div>
                    </div>

                    <!-- Resolución -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">N° Resolución</div>
                        <div class="col-lg-2">
                            <p:inputText value="#{certificadoController.resolucionSeleccionada}" 
                                         style="width:100%"
                                         required="true"
                                         requiredMessage="Ingrese número de resolución"/>
                        </div>
                    </div>

                    <!-- Fecha Certificado -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Fecha Certificado</div>
                        <div class="col-lg-3">
                            <p:calendar value="#{certificadoController.fechaCertificado}"
                                        pattern="dd/MM/yyyy"
                                        showButtonPanel="true"
                                        navigator="true"
                                        style="width:100%"/>
                        </div>
                    </div>

                </h:panelGroup>

            </div>
        </h:form>

        <!-- Dialog de Procesando -->
        <p:dialog id="dlgProcesando" widgetVar="dlgProcesando" modal="true" closable="false" resizable="false" draggable="false" style="width:200px;height:80px;">
            <div style="text-align:center;">
                <i class="fa fa-spinner fa-pulse fa-2x"></i>
                <p:outputLabel value=" Procesando..." style="margin-left:10px;"/>
            </div>
        </p:dialog>

    </ui:define>
</ui:composition>
