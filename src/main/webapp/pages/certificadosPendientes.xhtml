<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{certificadoPendienteQRController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Certificados pendientes</div>

        <h:form id="frmPendientes" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ===========================
                     CABECERA / ACCIONES
                ============================ -->
                <an:seccion cabLabel="Certificados por generar QR" cabLen="col-sm-6" cmdLen="col-sm-6">
                    <an:button cmdValue="Actualizar"
                               cmdIcon="fa fa-fw fa-refresh"
                               cmdClass="bntIconsMedio me-1"
                               cmdTooltip="Actualizar listado"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoPendienteQRController.doIniciarPagina()}"/>

                    <an:button cmdValue="Descargar PDF"
                               cmdIcon="fa fa-fw fa-file-pdf"
                               cmdClass="bntIconsMedio"
                               cmdTooltip="Descargar lista de certificados pendientes"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoPendienteQRController.doIniciarPagina(1)}"/>
                </an:seccion>

                <!-- ===========================
                     FILTRO
                ============================ -->
                <an:input cabValue="Buscar estudiante"
                          cabLen="col-lg-2"
                          conLen="col-lg-4"
                          opClass="d-flex"
                          conValue="#{certificadoPendienteQRController.strBusqueda}"
                          conRequired="false"
                          conTooltip="Ingrese nombre del estudiante y presione ENTER">
                    <f:facet name="extras">
                        <an:button cmdType="simple"
                                   cmdValue="Filtrar"
                                   cmdIcon="fa fa-fw fa-search"
                                   cmdClass="bntIconsMedio ms-2"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoPendienteQRController.doIniciarPagina()}"/>
                    </f:facet>
                </an:input>

                <an:extra comType="separadorSimple" comClass="my-2"/>

                <!-- ===========================
                     TABLA
                ============================ -->
                <an:table
                        id="tblPendientes"
                        cabId="dtPendientes"
                        cabValue="#{certificadoPendienteQRController.lstPendientes}"
                        cabPaginator="true">

                    <p:column headerText="Acciones">

                        <p:commandButton
                                value="Generar QR"
                                icon="pi pi-qrcode"
                                update="@form"
                                actionListener="#{certificadoPendienteQRController.doGenerarQr(registro)}"
                                rendered="#{!registro.tieneQr}" />

                        <h:outputText
                                value="GENERADO"
                                rendered="#{registro.tieneQr}" />

                    </p:column>

                    <p:column headerText="ID CERT">
                        #{registro.idCert}
                    </p:column>

                    <p:column headerText="MATRICULA">
                        #{registro.idMatricula}
                    </p:column>

                    <p:column headerText="ALUMNO">
                        #{registro.alumno}
                    </p:column>

                    <p:column headerText="NOTA">
                        #{registro.nota}
                    </p:column>

                    <p:column headerText="QR">
                        <h:outputText
                                value="SI"
                                rendered="#{registro.tieneQr}" />

                        <h:outputText
                                value="NO"
                                rendered="#{!registro.tieneQr}" />
                    </p:column>

                </an:table>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
