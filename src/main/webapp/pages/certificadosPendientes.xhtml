<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{certificadoController.doIniciarPendientes()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Certificados pendientes</div>

        <h:form id="frmPendientes" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ===========================
                     CABECERA / ACCIONES
                ============================ -->
                <an:seccion cabLabel="Certificados por firmar" cabLen="col-sm-6" cmdLen="col-sm-6">
                    <an:button cmdValue="Actualizar"
                               cmdIcon="fa fa-fw fa-refresh"
                               cmdClass="bntIconsMedio me-1"
                               cmdTooltip="Actualizar listado"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoController.doIniciarPendientes()}"/>

                    <an:button cmdValue="Descargar PDF"
                               cmdIcon="fa fa-fw fa-file-pdf"
                               cmdClass="bntIconsMedio"
                               cmdTooltip="Descargar lista de certificados pendientes"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoController.doDescargarPendientes(1)}"/>
                </an:seccion>

                <!-- ===========================
                     FILTRO
                ============================ -->
                <an:input cabValue="Buscar estudiante"
                          cabLen="col-lg-2"
                          conLen="col-lg-4"
                          opClass="d-flex"
                          conValue="#{certificadoController.strBusqueda}"
                          conRequired="false"
                          conTooltip="Ingrese nombre del estudiante y presione ENTER">
                    <f:facet name="extras">
                        <an:button cmdType="simple"
                                   cmdValue="Filtrar"
                                   cmdIcon="fa fa-fw fa-search"
                                   cmdClass="bntIconsMedio ms-2"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoController.doBuscarPendientes()}"/>
                    </f:facet>
                </an:input>

                <an:extra comType="separadorSimple" comClass="my-2"/>

                <!-- ===========================
                     TABLA
                ============================ -->
                <an:table id="tblPendientes"
                          cabId="dtPendientes"
                          cabValue="#{certificadoController.lstPendientes}"
                          cabPaginator="true"
                          cabClass="tablaGeneral">

                    <p:column width="120" headerText="Acciones" styleClass="text-center">
                        <an:button cmdType="link"
                                   cmdIcon="fa fa-fw fa-eye text-success"
                                   cmdTooltip="Ver detalle"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoController.doVerDetalle(registro)}"/>
                    </p:column>

                    <p:column width="60" headerText="N°" styleClass="text-center">
                        <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="140" headerText="CÓDIGO" styleClass="text-center" sortBy="#{registro.id}">
                        <an:celda optValue="#{registro.id}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="320" headerText="ESTUDIANTE" sortBy="#{registro.estudiante}">
                        <an:celda optValue="#{registro.estudiante}"/>
                    </p:column>

                    <p:column width="170" headerText="GRUPO" styleClass="text-center" sortBy="#{registro.grupo}">
                        <an:celda optValue="#{registro.grupo}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="260" headerText="CURSO" sortBy="#{registro.curso}">
                        <an:celda optValue="#{registro.curso}"/>
                    </p:column>

                    <p:column width="160" headerText="REG. DECANATURA" styleClass="text-center" sortBy="#{registro.regDecanatura}">
                        <an:celda optValue="#{registro.regDecanatura}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="140" headerText="MODALIDAD" styleClass="text-center" sortBy="#{registro.modalidad}">
                        <an:celda optValue="#{registro.modalidad}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="170" headerText="PROCEDENCIA" styleClass="text-center" sortBy="#{registro.procedencia}">
                        <an:celda optValue="#{registro.procedencia}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="140" headerText="FIRMA DECANO" styleClass="text-center">
                        <an:celda optValue="#{registro.firmaDecano}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="160" headerText="FIRMA DIRECTOR" styleClass="text-center">
                        <an:celda optValue="#{registro.firmaDirector}" comAlign="text-center"/>
                    </p:column>

                    <f:facet name="footer">
                        <an:celda txtClass="fw-bold bg-transparent"
                                  optValue="Total pendientes: #{certificadoController.lstPendientes != null ? certificadoController.lstPendientes.size() : 0}"/>
                    </f:facet>

                </an:table>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
