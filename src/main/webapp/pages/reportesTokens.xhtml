<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{certificadoController.doIniciarReportesTokens()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Listado de tokens</div>

        <h:form id="frmTokensRep" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ===========================
                     CABECERA / ACCIONES
                ============================ -->
                <an:seccion cabLabel="Disponibilidad de Tokens" cabLen="col-sm-6" cmdLen="col-sm-6">

                    <an:button cmdValue="Actualizar"
                               cmdIcon="fa fa-fw fa-refresh"
                               cmdClass="bntIconsMedio me-1"
                               cmdTooltip="Actualizar listado"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoController.doIniciarReportesTokens()}"/>

                    <!-- opcional si quieres export -->
                    <an:button cmdValue="Descargar PDF"
                               cmdIcon="fa fa-fw fa-file-pdf"
                               cmdClass="bntIconsMedio"
                               cmdTooltip="Descargar listado en PDF"
                               cmdUpdate="@form messages"
                               cmdAction="#{certificadoController.doDescargarReporteTokens(1)}"/>
                </an:seccion>

                <!-- ===========================
                     BUSCADOR
                ============================ -->
                <an:input cabValue="Búsqueda por alumno / token / curso"
                          cabLen="col-lg-3"
                          conLen="col-lg-5"
                          opClass="d-flex"
                          conValue="#{certificadoController.strBusquedaTokens}"
                          conRequired="false"
                          conTooltip="Escriba y presione Filtrar">
                    <f:facet name="extras">
                        <an:button cmdType="simple"
                                   cmdValue="Filtrar"
                                   cmdIcon="fa fa-fw fa-search"
                                   cmdClass="bntIconsMedio ms-2"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoController.doBuscarReportesTokens()}"/>
                    </f:facet>
                </an:input>

                <an:extra comType="separadorSimple" comClass="my-2"/>

                <!-- ===========================
                     TABLA
                ============================ -->
                <an:table id="tblTokensRep"
                          cabId="dtTokensRep"
                          cabValue="#{certificadoController.lstTokensReportView}"
                          cabPaginator="true"
                          cabClass="tablaGeneral">

                    <!-- ACCIONES -->
                    <p:column width="110" headerText="Acciones" styleClass="text-center">

                        <!-- Ver certificado -->
                        <an:button cmdType="link"
                                   cmdIcon="fa fa-fw fa-eye text-success"
                                   cmdTooltip="Ver certificado"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoController.doVerCertificadoToken(registro)}"/>

                        <!-- Opcional: marcar como usado (simulación admin) -->
                        <an:button cmdType="link"
                                   rendered="#{registro.estado eq 'DISPONIBLE'}"
                                   cmdIcon="fa fa-fw fa-play-circle text-primary ms-2"
                                   cmdTooltip="Marcar como usado (activa token)"
                                   conMensaje="¿Marcar este token como usado? Se activará por 15 días."
                                   cmdUpdate="@form messages"
                                   cmdAction="#{certificadoController.doMarcarUsado(registro)}"/>

                    </p:column>

                    <p:column width="60" headerText="Nro" styleClass="text-center">
                        <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="160" headerText="TOKEN" styleClass="text-center" sortBy="#{registro.token}">
                        <an:celda optValue="#{registro.token}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="320" headerText="ALUMNO" sortBy="#{registro.estudiante}">
                        <an:celda optValue="#{registro.estudiante}"/>
                    </p:column>

                    <p:column width="320" headerText="CURSO" sortBy="#{registro.curso}">
                        <an:celda optValue="#{registro.curso}"/>
                    </p:column>

                    <p:column width="150" headerText="ACTIVACIÓN" styleClass="text-center" sortBy="#{registro.fechaActivacionTxt}">
                        <an:celda optValue="#{registro.fechaActivacionTxt}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="150" headerText="VENCIMIENTO" styleClass="text-center" sortBy="#{registro.fechaVencimientoTxt}">
                        <an:celda optValue="#{registro.fechaVencimientoTxt}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="130" headerText="DÍAS RESTANTES" styleClass="text-center">
                        <an:celda optValue="#{registro.diasRestantesTxt}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="150" headerText="ESTADO" styleClass="text-center">
                        <an:celda comType="estado"
                                  optValue="#{registro.estado}"
                                  txtActivo="#{registro.estado eq 'ACTIVO' ? 'TRUE' : 'FALSE'}"
                                  comAlign="text-center"/>
                    </p:column>

                    <f:facet name="footer">
                        <an:celda txtClass="fw-bold bg-transparent"
                                  optValue="Total tokens: #{certificadoController.lstTokensReportView != null ? certificadoController.lstTokensReportView.size() : 0}"/>
                    </f:facet>

                </an:table>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
