<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{alumnoGeneralController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Lista de Alumnos</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <an:seccion cabLabel="Consulta de Alumnos" cabLen="col-sm-6" cmdLen="col-sm-6">
                    <an:button cmdValue="Volver"
                               cmdIcon="fa fa-arrow-left"
                               cmdAction="#{alumnoGeneralController.doVolver()}"
                               cmdTooltip="Volver"
                               rendered="#{not empty alumnoGeneralController.strBusqueda}"/>
                    <an:button cmdValue="Buscar"
                               cmdIcon="fa fa-search"
                               cmdAction="#{alumnoGeneralController.doBuscar()}"
                               cmdTooltip="Buscar alumnos por nombre o DNI"/>
                </an:seccion>

                <an:input cabValue="Búsqueda por nombre o DNI"
                          cabLen="col-lg-2"
                          conLen="col-lg-4"
                          conValue="#{alumnoGeneralController.strBusqueda}"
                          conTooltip="Ingrese nombre o DNI para buscar"
                          conRequired="false"/>
                <an:extra comType="separadorSimple" comClass="my-2"/>

                <an:table id="cdtAlumno"
                          cabId="cdtAlumno"
                          cabValue="#{alumnoGeneralController.lstAlumnosViewDTO}"
                          cabPaginator="true">

                    <p:column width="50" headerText="Nro" styleClass="text-center">
                        <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="100" headerText="Tipo" styleClass="text-center">
                        <an:celda optValue="#{registro.tipo}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="120" headerText="DNI" styleClass="text-center">
                        <an:celda optValue="#{registro.dni}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="250" headerText="Nombres Completos">
                        <an:celda optValue="#{registro.nombreCompleto}"/>
                    </p:column>

                    <p:column width="200" headerText="Correo" styleClass="text-center">
                        <an:celda optValue="#{registro.email}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="120" headerText="Celular" styleClass="text-center">
                        <an:celda optValue="#{registro.celular}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="150" headerText="Correo Login" styleClass="text-center">
                        <an:celda optValue="#{registro.correoLogin}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="150" headerText="Código" styleClass="text-center">
                        <an:celda optValue="#{registro.codigoEstudiante}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="100" headerText="Ciclo" styleClass="text-center">
                        <an:celda optValue="#{registro.cicloNumero}" comAlign="text-center"/>
                    </p:column>

                    <p:column width="120" headerText="Estado" styleClass="text-center">
                        <an:celda comType="estado" 
                                  optValue="#{registro.estado}" 
                                  txtActivo="#{registro.estado == 'ACTIVO' ? 'TRUE' : 'FALSE'}" 
                                  comAlign="text-center"/>
                    </p:column>

                    <f:facet name="footer">
                        <an:celda txtClass="fw-bold bg-transparent"
                                  optValue="Total alumnos: #{alumnoGeneralController.lstAlumnosViewDTO != null ? alumnoGeneralController.lstAlumnosViewDTO.size() : 0}"/>
                    </f:facet>

                </an:table>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
