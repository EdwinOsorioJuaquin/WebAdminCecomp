<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{certificadoController.doIniciarToken()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Generar Token de Certificados</div>

        <h:form id="frmToken" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <h:panelGroup id="pngListaToken" rendered="true">
                    <an:seccion cabLabel="Certificados pendientes de Token" cabLen="col-sm-6" cmdLen="col-sm-6">

                        <an:button cmdValue="Generar Token"
                                   cmdIcon="fa fa-qrcode"
                                   cmdTooltip="Generar tokens para los certificados seleccionados"
                                   cmdAction="#{certificadoController.doGenerarTokenMasivo()}"
                                   conMensaje="¿Desea generar los tokens para los certificados seleccionados?"
                                   cmdUpdate="@form messages"/>

                        <an:button cmdValue="Actualizar"
                                   cmdIcon="fa fa-refresh"
                                   cmdTooltip="Actualizar lista"
                                   cmdAction="#{certificadoController.doIniciarToken()}"
                                   cmdUpdate="@form messages"/>
                    </an:seccion>

                    <p:dataTable id="tblTokens"
                                 var="registro"
                                 value="#{certificadoController.lstToken}"
                                 selectionMode="multiple"
                                 selection="#{certificadoController.lstSeleccionados}"
                                 rowKey="#{registro.id}"
                                 paginator="true"
                                 rows="15"
                                 rowIndexVar="row"
                                 emptyMessage="No hay certificados pendientes de token"
                                 styleClass="table table-hover tablaGeneral"
                                 rowStyleClass="tablaBorde">

                        <p:column selectionMode="multiple" style="width:50px;text-align:center;"/>

                        <p:column width="60" headerText="Nro">
                            <an:celda comType="indice" optValue="#{row+1}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Estudiante" width="260">
                            <an:celda optValue="#{registro.estudiante}"/>
                        </p:column>

                        <p:column headerText="Curso" width="260">
                            <an:celda optValue="#{registro.curso}"/>
                        </p:column>

                        <p:column headerText="Reg. Decanatura" width="140" styleClass="text-center">
                            <an:celda optValue="#{registro.regDecanatura}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Modalidad" width="130" styleClass="text-center">
                            <an:celda optValue="#{registro.modalidad}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Procedencia" width="180" styleClass="text-center">
                            <an:celda optValue="#{registro.procedencia}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Firma Decano" width="130" styleClass="text-center">
                            <an:celda optValue="#{registro.firmaDecano}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Firma Director" width="140" styleClass="text-center">
                            <an:celda optValue="#{registro.firmaDirector}" comAlign="text-center"/>
                        </p:column>

                        <p:column headerText="Token" width="170" styleClass="text-center">
                            <h:outputText value="#{registro.token}"
                                          style="font-weight:bold;color:#{empty registro.token ? 'gray' : '#007bff'}"/>
                        </p:column>

                        <f:facet name="footer">
                            <h:outputText
                                value="Total pendientes: #{certificadoController.lstToken != null ? certificadoController.lstToken.size() : 0} | Seleccionados: #{certificadoController.lstSeleccionados != null ? certificadoController.lstSeleccionados.size() : 0}"
                                style="font-weight:bold;"/>
                        </f:facet>

                    </p:dataTable>
                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
