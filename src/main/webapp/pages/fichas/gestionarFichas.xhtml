<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{fichaController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">Gestionar Matrículas</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ========================================= -->
                <!-- VISTA LISTA                               -->
                <!-- ========================================= -->
                <h:panelGroup id="pngLista" rendered="#{fichaController.mostrarLista}">

                    <an:seccion cabLabel="Lista de Matrículas" cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdAction="#{fichaController.doVolver()}"
                                   cmdTooltip="Volver"
                                   rendered="#{not empty fichaController.strBusqueda}"/>
                        <an:button cmdValue="Buscar"
                                   cmdIcon="fa fa-search"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{fichaController.doBuscar()}"
                                   cmdTooltip="Buscar matrículas por alumno o curso"/>
                        <an:button cmdValue="Nueva Matrícula"
                                   cmdIcon="fa fa-plus"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form"
                                   cmdAction="#{fichaController.doNuevo()}"
                                   cmdTooltip="Registrar una nueva matrícula"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por alumno o curso"
                              cabLen="col-lg-2"
                              conLen="col-lg-4"
                              conValue="#{fichaController.strBusqueda}"
                              conTooltip="Ingrese nombre del alumno o curso para buscar"
                              conRequired="false"/>
                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table id="tblMatriculas"
                              cabId="tblMatriculas"
                              cabValue="#{fichaController.lstMatriculasViewDTO}"
                              cabPaginator="true"
                              cabClass="tablaGeneral">

                        <p:column width="100" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info"
                                       cmdValue="Editar"
                                       cmdTooltip="Editar matrícula"
                                       cmdUpdate="@form"
                                       cmdAction="#{fichaController.doEditar(registro)}"/>
                        </p:column>

                        <p:column width="50" headerText="Nro" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="DNI" styleClass="text-center">
                            <an:celda optValue="#{registro.dni}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="200" headerText="Alumno">
                            <an:celda optValue="#{registro.nombreCompleto}"/>
                        </p:column>

                        <p:column width="200" headerText="Curso">
                            <an:celda optValue="#{registro.nombreCurso}"/>
                        </p:column>

                        <p:column width="150" headerText="Docente">
                            <an:celda optValue="#{registro.nombreDocente}"/>
                        </p:column>

                        <p:column width="100" headerText="Tipo Desarrollo" styleClass="text-center">
                            <an:celda optValue="#{registro.nombreTipoDesarrollo}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="80" headerText="Grupo" styleClass="text-center">
                            <an:celda optValue="#{registro.nombreGrupo}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="100" headerText="Nota Final" styleClass="text-center">
                            <an:celda optValue="#{registro.notaFinal != null ? registro.notaFinal : '-'}" comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total matrículas: #{fichaController.lstMatriculasViewDTO != null ? fichaController.lstMatriculasViewDTO.size() : 0}"/>
                        </f:facet>

                    </an:table>

                </h:panelGroup>

                <!-- ========================================= -->
                <!-- VISTA NUEVO / EDITAR                      -->
                <!-- ========================================= -->
                <h:panelGroup id="pngNuevaMatricula"
                              rendered="#{fichaController.mostrarFormulario}"
                              layout="block">

                    <an:seccion cabLabel="#{fichaController.modoEdicion ? 'Editar Matrícula' : 'Nueva Matrícula'}" 
                                cabLen="col-sm-6" cmdLen="col-sm-6">
                        <an:button cmdValue="Volver"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdClass="bntIconsMedio me-1"
                                   cmdUpdate="@form"
                                   cmdAction="#{fichaController.doVolver()}"/>

                        <an:button cmdValue="Guardar"
                                   cmdIcon="fa fa-save"
                                   cmdClass="bntIconsMedio"
                                   cmdUpdate="@form messages"
                                   cmdAction="#{fichaController.doGuardar()}"
                                   cmdTooltip="Guardar la matrícula"/>
                    </an:seccion>

                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <!-- ================================ -->
                    <!-- DATOS DE MATRÍCULA               -->
                    <!-- ================================ -->

                    <!-- Select para Grupo -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Grupo *</div>
                        <div class="col-lg-6">
                            <p:selectOneMenu value="#{fichaController.idGrupoSeleccionado}" 
                                             style="width:100%"
                                             required="true"
                                             requiredMessage="Seleccione un grupo"
                                             disabled="#{fichaController.modoEdicion}">
                                <f:selectItem itemLabel="-- Seleccione Grupo --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{fichaController.lstGruposDTO}" 
                                               var="grupo"
                                               itemLabel="#{grupo.nombreCurso} - #{grupo.nombreDocente} - #{grupo.nombreGrupo}" 
                                               itemValue="#{grupo.idAd}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- Búsqueda de Alumno (solo en nuevo) -->
                    <h:panelGroup rendered="#{not fichaController.modoEdicion}">
                        <div class="row mb-2">
                            <div class="col-lg-2 text-end fw-bold">Buscar Alumno *</div>
                            <div class="col-lg-3">
                                <p:inputText value="#{fichaController.strBusquedaAlumno}" 
                                             style="width:100%"
                                             placeholder="DNI o nombre"
                                             onkeypress="if (event.keyCode == 13) { doBuscarAlumnos(); return false; }"/>
                            </div>
                            <div class="col-lg-1">
                                <p:commandButton value="Buscar" 
                                                 action="#{fichaController.doBuscarAlumnos()}"
                                                 update="@form"
                                                 icon="fa fa-search"
                                                 styleClass="btn btn-primary btn-sm"/>
                            </div>
                            <div class="col-lg-1">
                                <p:commandButton value="Limpiar" 
                                                 action="#{fichaController.doLimpiarBusquedaAlumno()}"
                                                 update="@form"
                                                 icon="fa fa-eraser"
                                                 styleClass="btn btn-secondary btn-sm"/>
                            </div>
                        </div>

                        <!-- Tabla de resultados de búsqueda -->
                        <div class="row mb-2" rendered="#{not empty fichaController.lstAlumnosBusqueda}">
                            <div class="col-lg-2"></div>
                            <div class="col-lg-8">
                                <an:table id="tblAlumnosBusqueda"
                                          cabId="tblAlumnosBusqueda"
                                          cabValue="#{fichaController.lstAlumnosBusqueda}"
                                          cabPaginator="false">

                                    <p:column width="100" headerText="Acciones" styleClass="text-center">
                                        <p:commandButton value="Seleccionar"
                                                         action="#{fichaController.doSeleccionarAlumno(registro)}"
                                                         update="@form"
                                                         icon="fa fa-check-circle"
                                                         styleClass="btn btn-success btn-sm"/>
                                    </p:column>

                                    <p:column width="50" headerText="Nro" styleClass="text-center">
                                        <an:celda comType="indice" optValue="#{row + 1}" comAlign="text-center"/>
                                    </p:column>

                                    <p:column width="120" headerText="DNI" styleClass="text-center">
                                        <an:celda optValue="#{registro.dni}" comAlign="text-center"/>
                                    </p:column>

                                    <p:column headerText="Nombre Completo">
                                        <an:celda optValue="#{registro.nombreCompleto}"/>
                                    </p:column>

                                    <p:column width="100" headerText="Tipo" styleClass="text-center">
                                        <an:celda optValue="#{registro.tipo}" comAlign="text-center"/>
                                    </p:column>

                                    <f:facet name="footer">
                                        <an:celda txtClass="fw-bold bg-transparent"
                                                  optValue="Total alumnos encontrados: #{fichaController.lstAlumnosBusqueda.size()}"/>
                                    </f:facet>

                                </an:table>
                            </div>
                        </div>
                    </h:panelGroup>

                    <!-- Alumno Seleccionado -->
                    <div class="row mb-2" rendered="#{fichaController.alumnoSeleccionado != null}">
                        <div class="col-lg-2 text-end fw-bold">Alumno Seleccionado</div>
                        <div class="col-lg-6">
                            <h:outputLabel value="#{fichaController.alumnoSeleccionado.dni} - #{fichaController.alumnoSeleccionado.nombreCompleto} (#{fichaController.alumnoSeleccionado.tipo})" 
                                           style="font-weight:bold;color:green"/>
                        </div>
                        <div class="col-lg-1" rendered="#{not fichaController.modoEdicion}">
                            <p:commandButton value="Cambiar" 
                                             action="#{fichaController.doLimpiarBusquedaAlumno()}"
                                             update="@form"
                                             icon="fa fa-exchange-alt"
                                             styleClass="btn btn-warning btn-sm"/>
                        </div>
                    </div>

                    <!-- Nota Final -->
                    <div class="row mb-2">
                        <div class="col-lg-2 text-end fw-bold">Nota Final</div>
                        <div class="col-lg-2">
                            <p:inputText value="#{fichaController.clsMatriculaEdit.notaFinal}" 
                                         style="width:100%"
                                         required="false"
                                         placeholder="0 - 20">
                                <f:convertNumber integerOnly="true"/>
                                <f:validateLongRange minimum="0" maximum="20"/>
                            </p:inputText>
                            <p:outputLabel value="(Valor entre 0 y 20)" style="font-size:11px;color:gray"/>
                        </div>
                    </div>

                    <!-- Campos ocultos o de solo lectura para edición -->
                    <h:panelGroup rendered="#{fichaController.modoEdicion}">
                        <div class="row mb-2">
                            <div class="col-lg-2 text-end fw-bold">Alumno</div>
                            <div class="col-lg-6">
                                <h:outputLabel value="#{fichaController.clsMatriculaEdit.drtPersonanatural.nombreCompleto}" 
                                               style="font-weight:bold;"/>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-lg-2 text-end fw-bold">DNI</div>
                            <div class="col-lg-3">
                                <h:outputLabel value="#{fichaController.clsMatriculaEdit.drtPersonanatural.numeroPndid}"/>
                            </div>
                        </div>
                    </h:panelGroup>

                    <!-- Instrucciones -->
                    <div class="card-cabecera row px-0 mt-3">
                        <div class="col-sm-12 px-1 divTituloCabecera">
                            <i class="bi bi-info-circle iconoCabecera"></i>
                            <label class="ui-outputlabel ui-widget">Instrucciones</label>
                        </div>
                    </div>
                    <ol class="ps-3 mb-0">
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">Complete todos los campos obligatorios (*).</label>
                        </li>
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">Busque el alumno por DNI o nombre para asignarlo a la matrícula.</label>
                        </li>
                        <li class="textoJustificadoRojo">
                            <label class="ui-outputlabel ui-widget">La nota final debe ser un valor entre 0 y 20.</label>
                        </li>
                    </ol>

                </h:panelGroup>

            </div>
        </h:form>

        <!-- Dialog de Procesando -->
        <p:dialog id="dlgProcesando" widgetVar="dlgProcesando" modal="true" closable="false" 
                  resizable="false" draggable="false" style="width:200px;height:80px;">
            <div style="text-align:center;">
                <i class="fa fa-spinner fa-pulse fa-2x"></i>
                <p:outputLabel value=" Procesando..." style="margin-left:10px;"/>
            </div>
        </p:dialog>

    </ui:define>
</ui:composition>
