<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla/plantilla.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                xmlns:f="jakarta.faces.core">
    <f:metadata>
        <f:viewAction action="#{nuevoController.doIniciarPagina()}"/>
    </f:metadata>
    <ui:define name="content">
        <div align="center" class="card-titulo mb-1">gestionar tipo de pago</div>
        <h:form id="frmPrincipal" class="form-horizontal h-100">
            <div id="divPrincipal" class="card-contenido">

                <!-- ================= LISTA ================= -->
                <h:panelGroup id="pngLista" rendered="#{tipoPagoController.strValor eq 'LISTA'}">
                    <an:seccion cabLabel="Tipos de pago">
                        <an:button cmdValue="Buscar"
                                   cmdAction="#{tipoPagoController.doBuscar()}"
                                   cmdTooltip="Buscar tipo de pago"
                                   cmdIcon="fa fa-search-plus"
                                   cmdUpdate="@form"/>

                        <an:button cmdValue="Nuevo"
                                   cmdAction="#{tipoPagoController.doNuevo()}"
                                   cmdTooltip="Registrar tipo de pago"
                                   cmdIcon="fa fa-plus"
                                   cmdUpdate="@form"/>
                    </an:seccion>

                    <an:input cabValue="Búsqueda por Nombre"
                              conValue="#{tipoPagoController.strBusqueda}"
                              conLen="col-lg-4"
                              opClass="d-flex"
                              conClass="textoButton"
                              conRequired="false"
                              conTooltip="Ingrese nombre y presione ENTER">
                        <f:facet name="extras">
                            <an:button cmdType="exec"
                                       cmdID="btBuscar"
                                       cmdIcon="fa fa-search"
                                       cmdAction="#{tipoPagoController.doBuscar()}"
                                       cmdUpdate="@form"/>
                        </f:facet>
                    </an:input>

                    <an:extra comType="separadorSimple" comClass="my-2"/>

                    <an:table id="dtTipoPago"
                              cabId="dtTipoPago"
                              cabValue="#{tipoPagoController.lstTiposView}"
                              cabPaginator="true">

                        <!-- Acciones -->
                        <p:column width="120" headerText="Acciones" styleClass="text-center">
                            <an:button cmdType="link"
                                       cmdIcon="fa fa-edit text-info"
                                       cmdTooltip="Editar"
                                       cmdAction="#{tipoPagoController.doEditar(registro)}"
                                       cmdUpdate="@form"/>

                            <an:button cmdType="link"
                                       rendered="#{registro.activo}"
                                       cmdIcon="fa fa-ban text-danger ms-2"
                                       cmdTooltip="Dar de baja"
                                       conMensaje="¿Está seguro de dar de baja este tipo de pago?"
                                       cmdAction="#{tipoPagoController.doCambiarEstado(registro)}"
                                       cmdUpdate="@form"/>

                            <an:button cmdType="link"
                                       rendered="#{!registro.activo}"
                                       cmdIcon="fa fa-check-circle text-success ms-2"
                                       cmdTooltip="Activar"
                                       conMensaje="¿Está seguro de activar este tipo de pago?"
                                       cmdAction="#{tipoPagoController.doCambiarEstado(registro)}"
                                       cmdUpdate="@form"/>
                        </p:column>

                        <p:column width="60" headerText="N°" styleClass="text-center">
                            <an:celda comType="indice" optValue="#{row+1}" comAlign="text-center"/>
                        </p:column>

                        <p:column width="260" headerText="NOMBRE" sortBy="#{registro.nombre}">
                            <an:celda optValue="#{registro.nombre}"/>
                        </p:column>

                        <!-- ✅ Estado -->
                        <p:column width="120" headerText="ESTADO" styleClass="text-center">
                            <an:celda comType="estado"
                                      optValue="#{registro.estado}"
                                      txtActivo="#{registro.estado eq 'ACTIVO' ? 'TRUE' : 'FALSE'}"
                                      comAlign="text-center"/>
                        </p:column>

                        <f:facet name="footer">
                            <an:celda txtClass="fw-bold bg-transparent"
                                      optValue="Total: #{tipoPagoController.lstTiposView != null ? tipoPagoController.lstTiposView.size() : 0}"/>
                        </f:facet>
                    </an:table>
                </h:panelGroup>

                <!-- ================= NUEVO / EDITAR ================= -->
                <h:panelGroup id="pngNuevo" rendered="#{tipoPagoController.strValor eq 'NUEVO'}">
                    <an:seccion cabLabel="#{tipoPagoController.idEdicion == null ? 'Agregar tipo de pago' : 'Editar tipo de pago'}">
                        <!-- Importante: volver sin validaciones, por eso update -->
                        <an:button cmdValue="Volver"
                                   cmdAction="#{tipoPagoController.doVolver()}"
                                   cmdTooltip="Volver a la lista"
                                   cmdIcon="fa fa-arrow-left"
                                   cmdUpdate="@form"/>

                        <an:button cmdValue="Guardar"
                                   cmdAction="#{tipoPagoController.doGuardar()}"
                                   cmdTooltip="Guardar"
                                   conMensaje="¿Seguro que desea guardar los cambios?"
                                   cmdIcon="fa fa-save"
                                   cmdUpdate="@form"/>
                    </an:seccion>

                    <an:input cabValue="Nombre"
                              conLen="col-lg-4"
                              conValue="#{tipoPagoController.nuevoTipo.nombre}"
                              conTooltip="Ingrese el nombre del tipo de pago"/>
                </h:panelGroup>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
