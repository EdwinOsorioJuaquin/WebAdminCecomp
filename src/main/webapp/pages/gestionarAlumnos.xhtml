<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:an="http://java.sun.com/jsf/composite/componentes"
                template="/plantilla/plantilla.xhtml">


    <f:metadata>
        <f:viewAction action="#{alumnoController.doIniciarPagina()}"/>
    </f:metadata>

    <ui:define name="content">
    <div align="center" class="card-titulo mb-1">Registrar Persona</div>

    <h:form id="frmAlumno">

        <!-- MENSAJES -->
        <p:growl id="growl" showDetail="true" life="3000"/>

        <!-- ===================================================== -->
        <!-- 🟦 PASO 1: PERSONA NATURAL -->
        <!-- ===================================================== -->
        <h:panelGroup rendered="#{alumnoController.pasoPersona}">

    <p:panel header="Registro de Persona Natural">

        <p:panelGrid columns="2" columnClasses="label,value">

            <!-- DNI -->
            <h:outputLabel value="DNI:" />
            <p:inputText value="#{alumnoController.personaEdit.numeroPndid}"
                         required="true"
                         requiredMessage="Ingrese DNI"/>

            <!-- NOMBRES -->
            <h:outputLabel value="Nombres:" />
            <p:inputText value="#{alumnoController.personaEdit.nombre}"
                         required="true"/>

            <!-- APELLIDOS -->
            <h:outputLabel value="Apellido Paterno:" />
            <p:inputText value="#{alumnoController.personaEdit.apPaterno}"
                         required="true"/>

            <h:outputLabel value="Apellido Materno:" />
            <p:inputText value="#{alumnoController.personaEdit.apMaterno}"
                         required="true"/>

            <!-- 🔥 SEXO -->
            <h:outputLabel value="Sexo:" />
            <p:selectOneMenu value="#{alumnoController.personaEdit.sexo}" required="true">
                <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                <f:selectItem itemLabel="Masculino" itemValue="M" />
                <f:selectItem itemLabel="Femenino" itemValue="F" />
            </p:selectOneMenu>

            <!-- 🔥 UBIGEO NAC -->
            <h:outputLabel value="Ubigeo Nacimiento:" />
            <p:inputNumber value="#{alumnoController.personaEdit.idUbgNac}"
                           required="true"/>

            <!-- 🔥 UBIGEO PROCEDENCIA -->
            <h:outputLabel value="Ubigeo Procedencia:" />
            <p:inputNumber value="#{alumnoController.personaEdit.idUbgPro}"
                           required="true"/>

            <!-- 🔥 COLEGIO -->
            <h:outputLabel value="Código Colegio:" />
            <p:inputNumber value="#{alumnoController.personaEdit.idColegio}"
                           required="true"/>

            <!-- 🔥 AÑO EGRESO -->
            <h:outputLabel value="Año Egreso:" />
            <p:inputNumber value="#{alumnoController.personaEdit.anioEgresoCole}"
                           required="true"/>

        </p:panelGrid>

        <br/>

        <p:commandButton value="Guardar Persona"
                         icon="pi pi-save"
                         action="#{alumnoController.doGuardarPersona()}"
                         update="@form growl"
                         process="@form"/>

    </p:panel>

</h:panelGroup>

    </h:form>
</ui:define>
</ui:composition>
